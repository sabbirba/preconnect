[package]
name = "preconnect_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "preconnect_native"
crate-type = ["cdylib", "staticlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
rand = "0.8"
