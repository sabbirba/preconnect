services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_REPO: sabbirba/preconnect
      secrets:
        - github_token
    restart: always
    expose:
      - "80"
    networks:
      - dokploy-network

secrets:
  github_token:
    environment: GITHUB_TOKEN

networks:
  dokploy-network:
    external: true
