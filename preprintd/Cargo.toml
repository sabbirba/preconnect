[package]
name = "preprintd"
description = "Printer swarm listener/worker implementation for PreConnect."
authors = ["Anindya Shiddhartha <shiddhartha@tuta.io>"]
license = "GPL-3.0-only"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "sysmontd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
reqwest = { version = "0.13.4", features = ["blocking", "rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
must_use_candidate = "warn"

[lints.rust]
unused_must_use = "deny"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
