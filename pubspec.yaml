name: preconnect
description: "Your personalised student portal for BRAC University"
publish_to: 'none'

version: 1.4.6+202602463

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.7
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.4
  http: ^1.6.0
  webview_flutter_android: ^4.10.11
  webview_flutter_wkwebview: ^3.23.7
  connectivity_plus: ^7.0.0
  webview_flutter: ^4.13.1
  intl: ^0.20.2
  android_intent_plus: ^6.0.0
  qr: ^3.0.2
  mobile_scanner: ^7.2.0
  archive: ^4.0.9
  flutter_alarmkit: ^0.0.10
  barcode_widget: ^2.0.4
  flutter_flip_card: ^0.0.6
  flutter_svg: ^2.2.3
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  in_app_update: ^4.2.5
  in_app_review: ^2.0.11
  package_info_plus: ^9.0.0
  


dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7

flutter_native_splash:
  color: "#EAF4FF"
  color_dark: "#000000"
  image: "web/icons/Icon-512.png"
  image_dark: "web/icons/Icon-512.png"
  android: true
  ios: true
  web: false
  android_12:
    color: "#EAF4FF"
    color_dark: "#000000"
    image: "web/icons/Icon-512.png"
    image_dark: "web/icons/Icon-512.png"


flutter:

  uses-material-design: true
