version: 2.0.1+202608010

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.7
  permission_handler: ^12.0.2
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  intl: ^0.20.3
  mobile_scanner: ^7.4.0
  image_picker: ^1.2.3
  archive: ^4.0.9
  dart_pdf_reader: ^2.2.0
  barcode_widget: ^2.0.4
  flutter_flip_card: ^0.0.6
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.0
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  file_selector: ^1.1.0
  share_plus: ^13.2.1
  open_filex: ^4.7.0
  in_app_update_flutter: ^3.0.0
  in_app_review: ^2.0.12
  local_auth: ^3.0.2
  chrome_extension: ^0.4.0
  cupertino_icons: ^1.0.9
  web: ^1.1.1
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  firebase_core: ^4.12.1
  firebase_messaging: 16.4.3
  flutter_local_notifications: ^22.1.0
  flutter_cache_manager: ^3.4.2
  package_info_plus: ^10.2.0
  device_info_plus: ^13.2.0
  gap: ^3.0.1
  add_2_calendar: ^3.0.1

