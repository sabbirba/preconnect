name: preconnect
description: "Your personalised student portal for BRAC University"
publish_to: "none"

version: 1.6.0+202604081

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: ^10.0.0
