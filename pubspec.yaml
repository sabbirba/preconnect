name: preconnect
description: "Fast, Calm Academic Companion App. An initiative run by BRAC University students."
publish_to: "none"

version: 2.1.2+202611000

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.8
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  webview_flutter: ^4.14.1
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  archive: ^4.5.2
  barcode_widget: ^2.0.4
  flutter_flip_card: ^0.0.6
  cached_network_image: ^4.0.5
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.2
  app_links: ^7.2.2
  file_selector: ^1.1.0
  share_plus: ^13.3.0
  local_auth: ^3.0.2
  chrome_extension: ^0.4.0
  web: ^1.1.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.0-dev.5
  flutter_cache_manager: ^3.4.5
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  gap: ^3.0.1
  cupertino_icons: ^2.0.0
  home_widget: ^0.10.0
  printing: ^5.15.1
  pdf: ^3.13.1
  image: ^4.12.0

dev_dependencies:
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.1
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/icon.png
