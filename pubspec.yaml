name: preconnect
description: "Fast, Calm Academic Companion App. An initiative run by BRAC University students."
publish_to: "none"

version: 2.0.8+202608119

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.7
  permission_handler: ^13.0.1
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  intl: any
  flutter_zxing: ^2.3.0
  image_picker: ^1.2.3
  archive: ^4.2.0
  barcode_widget: ^2.0.4
  flutter_flip_card: ^0.0.6
  cached_network_image: ^4.0.0
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  file_selector: ^1.1.0
  share_plus: ^13.3.0
  local_auth: ^3.0.2
  chrome_extension: ^0.4.0
  web: ^1.1.1
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  flutter_cache_manager: ^3.4.2
  package_info_plus: ^10.2.0
  device_info_plus: ^13.2.0
  gap: ^3.0.1
  cupertino_icons: ^1.0.9
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/icon.png
