name: preconnect
description: "Fast, Calm Academic Companion App. An initiative run by BRAC University students."
publish_to: "none"

version: 1.6.8+202607000

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.7
  permission_handler: ^12.0.2
  shared_preferences: ^2.5.5
  webview_flutter_android: ^4.13.0
  webview_flutter: ^4.14.1
  intl: ^0.20.3
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.3
  archive: ^4.0.9
  dart_pdf_reader: ^2.2.0
  flutter_alarmkit: ^0.3.0
  barcode_widget: ^2.0.4
  flutter_flip_card: ^0.0.6
  cached_network_image: ^3.4.1
  signals_flutter: ^7.1.0
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.2.0
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
  share_plus: ^13.2.0
  open_filex: ^4.7.0
  in_app_update: ^5.0.0
  in_app_review: ^2.0.12
  local_auth: ^3.0.1
  chrome_extension: ^0.4.0
  web: ^1.1.1
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.4.1
  firebase_analytics: ^12.4.3
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  flutter_gen_runner: ^5.8.0
  json_annotation: ^4.12.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_gen:
  output: lib/gen/
  line_length: 80

