server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    port_in_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;

    location ~* \.(php|php3|php4|php5|php7|phtml|phar)$ {
        return 444;
    }

    location ~* /(\.env|\.git|\.htaccess|\.htpasswd|\.DS_Store|wp-config\.php|web\.config|phpinfo|server-info|server-status) {
        return 444;
    }

    location ~* \.(json)$ {
        if ($uri ~* /(service-account|credentials|gcp-key|gcp-sa|gcp-credentials|firebase|google-key|google-credentials|application_default_credentials|key|keyfile|sa)\.) {
            return 444;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(sql|bak|old|backup|dump|swp|swo|pem|key|crt|p12|pfx)$ {
        return 444;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

