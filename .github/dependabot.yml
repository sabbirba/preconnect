version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Dhaka"
    target-branch: "main"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "pub"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 0
    versioning-strategy: "increase"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "dart"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 0
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "bundler"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 0
    versioning-strategy: "increase"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ruby"

  - package-ecosystem: "gradle"
    directory: "/android"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 0
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
