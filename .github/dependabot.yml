version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Dhaka"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "main"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "dependencies"
      - "dart"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "bundler"
    directory: "/"
    target-branch: "main"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "dependencies"
      - "ruby"

  - package-ecosystem: "gradle"
    directory: "/android"
    target-branch: "main"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "dependencies"
      - "android"
