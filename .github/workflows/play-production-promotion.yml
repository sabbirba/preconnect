name: Google Play Production Promotion

on:
  schedule:
    # Weekly Update on Thursday 10:00 PM Bangladesh Time.
    - cron: "00 16 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-production-promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote-google-play-production:
    name: Promote Beta to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Android Package
        id: android_meta
        shell: bash
        run: |
          PACKAGE_NAME=$(grep -E 'applicationId\s*=' android/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Check Google Play Credentials
        id: play_auth
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not provided."
          fi

      - name: Set up Ruby for Fastlane
        if: steps.play_auth.outputs.enabled == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        if: steps.play_auth.outputs.enabled == 'true'
        shell: bash
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
        run: gem install fastlane --no-document

      - name: Promote Beta to Production
        if: steps.play_auth.outputs.enabled == 'true'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_OPT_OUT_USAGE: "1"
        run: |
          fastlane supply \
            --package_name "${{ steps.android_meta.outputs.package_name }}" \
            --json_key_data "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" \
            --track "beta" \
            --track_promote_to "production" \
            --track_promote_release_status "completed" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_metadata true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true

  publish-chrome-extension:
    name: Publish Chrome Extension
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download Latest Chrome Extension Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p build
          release_json="$(
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          )"

          asset_url="$(
            printf '%s' "$release_json" | jq -r '
              .assets[]
              | select(.name | test("^PreConnect-chrome-extension-release-.*\\.zip$"))
              | .browser_download_url
            ' | head -n1
          )"

          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "No Chrome extension zip asset was found on the latest release."
            exit 1
          fi

          curl -fsSL -L "$asset_url" -o build/chrome-extension.zip

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Chrome Web Store Service Account
        id: auth
        shell: bash
        env:
          CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          key_file="$RUNNER_TEMP/chrome-web-store-service-account.json"
          printf '%s' "$CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON" > "$key_file"
          chmod 600 "$key_file"
          gcloud auth activate-service-account --key-file="$key_file"

          access_token="$(
            gcloud auth print-access-token \
              --scopes=https://www.googleapis.com/auth/chromewebstore
          )"
          echo "::add-mask::$access_token"
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Publish Chrome Web Store Item
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
        shell: bash
        run: |
          curl \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -X POST \
            -T build/chrome-extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CHROME_WEBSTORE_PUBLISHER_ID}/items/${CHROME_WEBSTORE_EXTENSION_ID}:upload"

          curl \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_WEBSTORE_PUBLISHER_ID}/items/${CHROME_WEBSTORE_EXTENSION_ID}:publish"
