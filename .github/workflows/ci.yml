name: CI

on:
  pull_request:
    paths:
      - "**/*.dart"
      - "**/*.sh"
      - "web/**"
      - "tool/**"
      - ".github/workflows/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
  push:
    branches:
      - main
    paths:
      - "**/*.dart"
      - "**/*.sh"
      - "web/**"
      - "tool/**"
      - ".github/workflows/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Audit Compliance (0 Databases, 0 Trackers, 0 Secrets)
        run: ./tool/scan_compliance.sh

      - name: Audit License Compliance
        run: ./tool/check_licenses.sh

      - name: Verify Version & Store Metadata Sync
        run: ./tool/sync_versions.sh sync-metadata

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib web test

      - name: Analyze
        run: flutter analyze

      - name: Validate Browser Extension Manifests & CSP
        run: ./tool/validate_extension.sh

      - name: Test
        run: flutter test
