name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter-version: ['stable']
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter SDK
        run: |
          set -eux
          FLUTTER_DIR="$HOME/flutter"
          FLUTTER_VERSION="${{ matrix.flutter-version }}"
          # Remove any previous install
          rm -rf "$FLUTTER_DIR"
          # Try to clone the requested branch/tag; fall back to stable if not found
          if git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_DIR"; then
            echo "Cloned flutter $FLUTTER_VERSION"
          else
            echo "Requested $FLUTTER_VERSION not found; cloning stable"
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          fi
          echo "$FLUTTER_DIR/bin" >> $GITHUB_PATH
          "$FLUTTER_DIR/bin/flutter" --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.flutter
          key: ${{ runner.os }}-pub-${{ matrix.flutter-version }}-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub
