# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    paths:
      - "**/*.dart"
      - "**/*.sh"
      - "web/**"
      - "android/**"
      - "ios/**"
      - "macos/**"
      - "assets/**"
      - "firebase.json"
      - ".env.example"
      - "tool/**"
      - ".github/workflows/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
  push:
    branches:
      - main
    paths:
      - "**/*.dart"
      - "**/*.sh"
      - "web/**"
      - "android/**"
      - "ios/**"
      - "macos/**"
      - "assets/**"
      - "firebase.json"
      - ".env.example"
      - "tool/**"
      - ".github/workflows/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        id: dependencies
        run: flutter pub get --enforce-lockfile

      - name: Audit Compliance (0 Databases, 0 Trackers, 0 Secrets)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./tool/scan_compliance.sh

      - name: Audit License Compliance
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./tool/check_licenses.sh

      - name: Verify Version Sync
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./tool/sync_versions.sh read

      - name: Verify Formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: dart format --output=none --set-exit-if-changed lib web test

      - name: Analyze
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter analyze

      - name: Analyze Extension Entry Points
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: dart analyze --fatal-infos web/background.dart web/background_models.dart web/extension_app.dart


  tests:
    name: Flutter Tests (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: [vm, chrome]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Record Test Environment
        run: |
          mkdir -p reports
          flutter --version --machine > reports/flutter.json
          flutter pub deps --json > reports/dependencies.json
          git rev-parse HEAD > reports/commit.txt

      - name: Run All VM Tests With Coverage
        if: matrix.platform == 'vm'
        run: >-
          flutter test --no-pub --coverage --reporter expanded
          --file-reporter json:reports/tests.json
          2>&1 | tee reports/tests.log

      - name: Run Shared Behavior Tests in Chrome
        if: matrix.platform == 'chrome'
        run: >-
          flutter test --no-pub --platform chrome --reporter expanded
          --file-reporter json:reports/tests.json
          test/oauth_test.dart test/refresh_test.dart test/schedule_test.dart
          test/time_test.dart test/availability_test.dart
          2>&1 | tee reports/tests.log

      - name: Generate Coverage Report
        if: ${{ !cancelled() && matrix.platform == 'vm' && hashFiles('coverage/lcov.info') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov
          lcov --summary coverage/lcov.info 2>&1 | tee reports/coverage.txt
          genhtml coverage/lcov.info --output-directory coverage/html
          {
            echo '## Flutter Line Coverage'
            echo
            echo 'Coverage measures source files loaded by the VM suite; unimported files are not included.'
            echo
            echo '```text'
            cat reports/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize Test Results
        if: ${{ !cancelled() && hashFiles('reports/tests.json') != '' }}
        run: |
          jq -rs '
            [ .[] | select(.type == "testDone" and .hidden != true) ] as $tests |
            [ .[] | select(.type == "done") ] as $done |
            "## Flutter Test Results",
            "",
            "Passed: \($tests | map(select(.result == "success" and .skipped != true)) | length)",
            "Failed: \($tests | map(select(.result != "success" and .skipped != true)) | length)",
            "Skipped: \($tests | map(select(.skipped == true)) | length)",
            "Runner completed successfully: \($done | last | .success // false)"
          ' reports/tests.json | tee reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Results and Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-tests-${{ matrix.platform }}
          path: |
            reports/
            coverage/
          retention-days: 14
          if-no-files-found: error

  builds:
    name: Flutter Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            runner: ubuntu-latest
          - target: extensions
            runner: ubuntu-latest
          - target: android
            runner: ubuntu-latest
          - target: ios
            runner: macos-15
          - target: macos
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle Cache
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Record Build Environment
        run: |
          mkdir -p reports
          flutter --version --machine > reports/flutter.json
          git rev-parse HEAD > reports/commit.txt
          cp .env.example .env

      - name: Build Web Release
        if: matrix.target == 'web'
        run: |
          flutter build web --release --no-pub --tree-shake-icons --csp --no-wasm-dry-run --no-web-resources-cdn --dart-define-from-file=.env 2>&1 | tee reports/web.log
          du -sk build/web > reports/build_size.txt

      - name: Build and Validate Chrome and Firefox Extensions
        if: matrix.target == 'extensions'
        run: |
          ./tool/build_extension.sh --no-pub 2>&1 | tee reports/extensions.log
          ./tool/validate_extension.sh 2>&1 | tee reports/extension_validation.log
          unzip -t build/chrome-extension.zip
          unzip -t build/firefox-extension.zip
          du -k build/chrome-extension.zip build/firefox-extension.zip > reports/build_size.txt

      - name: Build Android APK and App Bundle
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --no-pub --target-platform android-arm,android-arm64 --split-per-abi --dart-define-from-file=.env 2>&1 | tee reports/android_apk.log
          flutter build appbundle --release --no-pub --target-platform android-arm,android-arm64 --dart-define-from-file=.env 2>&1 | tee reports/android_bundle.log
          du -k build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab > reports/build_size.txt

      - name: Build Unsigned iOS Release
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign --no-pub --dart-define-from-file=.env 2>&1 | tee reports/ios.log
          du -sk build/ios/iphoneos/Runner.app > reports/build_size.txt

      - name: Build Unsigned macOS Release
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release --config-only --no-pub --dart-define-from-file=.env 2>&1 | tee reports/macos_config.log
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -derivedDataPath build/macos-ci CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build 2>&1 | tee reports/macos.log
          du -sk build/macos-ci/Build/Products/Release/*.app > reports/build_size.txt

      - name: Upload Build Diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-build-${{ matrix.target }}
          path: reports/
          retention-days: 14
          if-no-files-found: error
