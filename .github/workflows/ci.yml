# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    paths:
      - "**/*.dart"
      - "**/*.sh"
      - "web/**"
      - "android/**"
      - "ios/**"
      - "macos/**"
      - "assets/**"
      - "firebase.json"
      - ".env.example"
      - "tool/**"
      - ".github/workflows/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
  push:
    branches:
      - main
    paths:
      - "**/*.dart"
      - "**/*.sh"
      - "web/**"
      - "android/**"
      - "ios/**"
      - "macos/**"
      - "assets/**"
      - "firebase.json"
      - ".env.example"
      - "tool/**"
      - ".github/workflows/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        id: dependencies
        run: flutter pub get --enforce-lockfile

      - name: Audit Compliance (0 Databases, 0 Trackers, 0 Secrets)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./tool/scan_compliance.sh

      - name: Audit License Compliance
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./tool/check_licenses.sh

      - name: Verify Version Sync
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./tool/sync_versions.sh read

      - name: Verify Formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: dart format --output=none --set-exit-if-changed lib web

      - name: Analyze
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter analyze

      - name: Analyze Extension Entry Points
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: dart analyze --fatal-infos web/background.dart web/background_models.dart web/extension_app.dart

  build-web-extension:
    name: Build Web & Extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Record Build Environment
        run: |
          mkdir -p reports
          flutter --version --machine > reports/flutter.json
          git rev-parse HEAD > reports/commit.txt
          cp .env.example .env

      - name: Build Web Release
        run: |
          flutter build web --release --no-pub --tree-shake-icons --csp --no-wasm-dry-run --no-web-resources-cdn --dart-define-from-file=.env 2>&1 | tee reports/web.log
          du -sk build/web > reports/web_build_size.txt

      - name: Build and Validate Chrome and Firefox Extensions
        run: |
          ./tool/build_extension.sh --no-pub 2>&1 | tee reports/extensions.log
          ./tool/validate_extension.sh 2>&1 | tee reports/extension_validation.log
          unzip -t build/chrome-extension.zip
          unzip -t build/firefox-extension.zip
          du -k build/chrome-extension.zip build/firefox-extension.zip > reports/extensions_build_size.txt

      - name: Upload Build Diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-build-web-extension
          path: reports/
          retention-days: 14
          if-no-files-found: error
