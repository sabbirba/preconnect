name: Build Windows Printer

on:
  push:
    branches:
      - main
    paths:
      - "printer.c"
      - "Dockerfile.printer"
      - ".github/workflows/printer.yml"
  pull_request:
    paths:
      - "printer.c"
      - "Dockerfile.printer"
      - ".github/workflows/printer.yml"
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: printer-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Executable
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Compile Executable
        run: |
          cl /O2 /GL /GS /guard:cf /W4 /WX /Fe:printer.exe printer.c /link /LTCG /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup user32.lib ws2_32.lib winhttp.lib crypt32.lib bcrypt.lib rpcrt4.lib shell32.lib shlwapi.lib advapi32.lib


      - name: Generate Package
        shell: powershell
        env:
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $k = $env:WORKER_KEY
          $k = if ([string]::IsNullOrWhiteSpace($k)) { "" } else { $k -replace '\s+', '' }
          @(
            '@echo off',
            'net session >nul 2>&1',
            'if %errorlevel% neq 0 (',
            '  powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process cmd -ArgumentList ''/c \"\"%~f0\"\" %*'' -Verb RunAs"',
            '  exit /b',
            ')',
            'cd /d "%~dp0"',
            'set "k=%~1"',
            'if not defined k if defined WORKER_KEY set "k=%WORKER_KEY%"',
            if ($k) { 'if not defined k set "k=' + $k + '"' } else { 'if not defined k for /f "usebackq delims=" %%A in (`powershell -NoProfile -Command "$s = Read-Host ''Worker Key'' -AsSecureString; [System.Runtime.InteropServices.Marshal]::PtrToStringAuto([System.Runtime.InteropServices.Marshal]::SecureStringToBSTR($s))"`) do set "k=%%A"' },
            'if not defined k exit /b 1',
            'set "d=%ProgramData%\sysmon"',
            'if not exist "%d%" mkdir "%d%"',
            'powershell -NoProfile -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13; Invoke-WebRequest -Uri ''https://github.com/sabbirba/preconnect/releases/latest/download/printer.exe'' -OutFile ''%d%\printer.exe'' -UseBasicParsing"',
            'for /f "usebackq delims=" %%A in (`powershell -NoProfile -Command "Add-Type -AssemblyName System.Security; $e=[System.Security.Cryptography.ProtectedData]::Protect([System.Text.Encoding]::UTF8.GetBytes(''%k%''),$null,[System.Security.Cryptography.DataProtectionScope]::LocalMachine); ''DPAPI:'' + [Convert]::ToBase64String($e)"`) do set "dpapi=%%A"',
            'schtasks /Create /TN "sysmon" /TR "\"%d%\printer.exe\" \"%dpapi%\"" /SC ONSTART /RU "SYSTEM" /RL HIGHEST /F >nul',
            'schtasks /Run /TN "sysmon" >nul'
          ) | Set-Content -Path "install.bat" -Encoding ASCII

          @(
            '@echo off',
            'net session >nul 2>&1',
            'if %errorlevel% neq 0 (',
            '  powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process cmd -ArgumentList ''/c \"\"%~f0\"\"'' -Verb RunAs"',
            '  exit /b',
            ')',
            'taskkill /F /IM printer.exe >nul 2>&1',
            'schtasks /End /TN "sysmon" >nul 2>&1',
            'schtasks /Delete /TN "sysmon" /F >nul 2>&1',
            'set "d=%ProgramData%\sysmon"',
            'if exist "%d%" rmdir /s /q "%d%" >nul 2>&1',
            'del /f /q "%APPDATA%\sysmontd.id" >nul 2>&1',
            'del /f /q "%LOCALAPPDATA%\sysmontd.id" >nul 2>&1'
          ) | Set-Content -Path "uninstall.bat" -Encoding ASCII

          $tag = (gh release list --limit 1 --json tagName --jq '.[0].tagName')
          $ver = if ($tag) { $tag -replace '^v','' } else { "2.0.6+202608088" }
          $zip = "PreConnect-printer-windows-x64-release-$ver.zip"
          Compress-Archive -Path install.bat, uninstall.bat -DestinationPath $zip -Force
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: printer-windows
          path: |
            printer.exe
            install.bat
            uninstall.bat
            ${{ env.ZIP_NAME }}

      - name: Upload to Latest Release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "$LATEST_TAG" ]; then
            gh release upload "$LATEST_TAG" printer.exe install.bat "$ZIP_NAME" --clobber
          fi

  publish-package:
    name: Publish Container Package
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: printer-windows
          path: .

      - name: Read Version
        id: version
        shell: bash
        run: |
          mapfile -t VERSION_PARTS < <(./tool/sync_versions.sh read)
          echo "version=${VERSION_PARTS[0]}" >> "$GITHUB_OUTPUT"

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.printer
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/preconnect-printer:latest
            ghcr.io/${{ github.repository_owner }}/preconnect-printer:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/preconnect-printer:v${{ steps.version.outputs.version }}
