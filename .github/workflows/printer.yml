name: Build Windows Printer Worker

on:
  push:
    branches:
      - main
    paths:
      - "printer.c"
      - "Dockerfile.printer"
      - ".github/workflows/printer.yml"
  pull_request:
    paths:
      - "printer.c"
      - "Dockerfile.printer"
      - ".github/workflows/printer.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: printer-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Executable
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Compile Executable
        run: |
          cl /O2 /W4 /WX /guard:cf /Fe:printer.exe printer.c user32.lib ws2_32.lib winhttp.lib crypt32.lib winspool.lib rpcrt4.lib shell32.lib advapi32.lib

      - name: Generate Package
        shell: powershell
        env:
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item printer.exe -Destination dist\printer.exe
          $k = $env:WORKER_KEY
          if ([string]::IsNullOrWhiteSpace($k)) { $k = "<YOUR_WORKER_KEY>" }
          Add-Type -AssemblyName System.Security
          $e = [System.Security.Cryptography.ProtectedData]::Protect([System.Text.Encoding]::UTF8.GetBytes($k), $null, [System.Security.Cryptography.DataProtectionScope]::LocalMachine)
          $dpapi = "DPAPI:" + [Convert]::ToBase64String($e)
          $lines = @(
            '@echo off',
            'cd /d "%~dp0"',
            'set "d=%ProgramData%\printer"',
            'if not exist "%d%" mkdir "%d%"',
            'copy /y "%~dp0printer.exe" "%d%\printer.exe" >nul',
            'schtasks /Create /TN "printer" /TR "\"%d%\printer.exe\" \"' + $dpapi + '\"" /SC ONLOGON /RL HIGHEST /F >nul',
            'schtasks /Run /TN "printer" >nul'
          )
          Set-Content -Path "dist\install.bat" -Value $lines -Encoding ASCII
          $uninstLines = @(
            '@echo off',
            'taskkill /F /IM printer.exe >nul 2>&1',
            'schtasks /End /TN "printer" >nul 2>&1',
            'schtasks /Delete /TN "printer" /F >nul 2>&1',
            'set "d=%ProgramData%\printer"',
            'if exist "%d%" rmdir /s /q "%d%" >nul 2>&1'
          )
          Set-Content -Path "dist\uninstall.bat" -Value $uninstLines -Encoding ASCII

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: printer-windows
          path: dist/*

  publish-package:
    name: Publish Container Package
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: printer-windows
          path: .

      - name: Read Version
        id: version
        shell: bash
        run: |
          mapfile -t VERSION_PARTS < <(./tool/sync_versions.sh read)
          echo "version=${VERSION_PARTS[0]}" >> "$GITHUB_OUTPUT"

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.printer
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/preconnect-printer:latest
            ghcr.io/${{ github.repository_owner }}/preconnect-printer:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/preconnect-printer:v${{ steps.version.outputs.version }}
