# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Printer

on:
  push:
    branches:
      - main
    paths:
      - "printer.c"
      - "Dockerfile.printer"
      - ".github/workflows/printer.yml"
  pull_request:
    paths:
      - "printer.c"
      - "Dockerfile.printer"
      - ".github/workflows/printer.yml"
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: printer-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Executable
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Compile Executable
        run: |
          cl /O2 /GL /GS /guard:cf /W4 /WX /Fe:printer.exe printer.c /link /LTCG /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup user32.lib ws2_32.lib winhttp.lib crypt32.lib bcrypt.lib rpcrt4.lib shell32.lib shlwapi.lib advapi32.lib

      - name: Generate Package
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $key_prompt = @(
            'echo PreConnect Setup',
            ':ask',
            'set "k="',
            'set /p "k=Enter Worker Key: "',
            'if not defined k goto ask',
            ':ask_ua',
            'set "ua="',
            'set /p "ua=Enter User-Agent: "',
            'if not defined ua goto ask_ua',
            'echo Verifying worker key...',
            'powershell -NoProfile -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13; $c = 0; try { $r = [System.Net.HttpWebRequest]::Create(''https://api.preconnect.app/printer''); $r.Headers.Add(''X-Worker-Key'', $env:k); $r.UserAgent = $env:ua; $r.Method = ''GET''; $r.Timeout = 10000; $resp = $r.GetResponse(); $c = [int]$resp.StatusCode; $resp.Close() } catch [System.Net.WebException] { if ($_.Response) { $c = [int]$_.Response.StatusCode; $_.Response.Close() } } catch {}; if ($c -eq 401) { exit 1 } else { exit 0 }"',
            'if errorlevel 1 (',
            '  echo Error: Invalid Worker Key. Please check and try again.',
            '  goto ask',
            ')'
          ) -join "`n"

          @(
            '@echo off',
            'setlocal',
            'net session >nul 2>&1',
            'if %errorlevel% neq 0 (',
            '  powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process cmd -ArgumentList ''/k \"\"%~f0\"\"'' -Verb RunAs"',
            '  exit /b',
            ')',
            'cd /d "%~dp0"',
            $key_prompt,
            'taskkill /F /IM printer.exe >nul 2>&1',
            'set "d=%ProgramData%\sysmon"',
            'if not exist "%d%" mkdir "%d%"',
            'powershell -NoProfile -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13; Invoke-WebRequest -Uri ''https://github.com/sabbirba/preconnect/releases/latest/download/printer.exe'' -OutFile ''%d%\printer.exe'' -UseBasicParsing"',
            'for /f "usebackq delims=" %%A in (`powershell -NoProfile -Command "$raw=[System.Text.Encoding]::UTF8.GetBytes($env:k); Add-Type -AssemblyName System.Security; $e=[System.Security.Cryptography.ProtectedData]::Protect($raw,$null,[System.Security.Cryptography.DataProtectionScope]::LocalMachine); ''DPAPI:'' + [Convert]::ToBase64String($e)"`) do set "dpapi=%%A"',
            'schtasks /Create /TN "sysmon" /TR "\"%d%\printer.exe\" \"%dpapi%\" \"%ua%\"" /SC ONSTART /RU "SYSTEM" /RL HIGHEST /F >nul',
            'schtasks /Run /TN "sysmon" >nul',
            'echo Setup completed successfully.',
            'timeout /t 3 >nul',
            'endlocal'
          ) | Set-Content -Path "admin.bat" -Encoding ASCII

          @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            $key_prompt,
            'taskkill /F /IM printer.exe >nul 2>&1',
            'set "d=%LOCALAPPDATA%\sysmon"',
            'if not exist "%d%" mkdir "%d%"',
            'powershell -NoProfile -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13; Invoke-WebRequest -Uri ''https://github.com/sabbirba/preconnect/releases/latest/download/printer.exe'' -OutFile ''%d%\printer.exe'' -UseBasicParsing"',
            'for /f "usebackq delims=" %%A in (`powershell -NoProfile -Command "$raw=[System.Text.Encoding]::UTF8.GetBytes($env:k); Add-Type -AssemblyName System.Security; $e=[System.Security.Cryptography.ProtectedData]::Protect($raw,$null,[System.Security.Cryptography.DataProtectionScope]::CurrentUser); ''DPAPI:'' + [Convert]::ToBase64String($e)"`) do set "dpapi=%%A"',
            'reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "sysmon" /t REG_SZ /d "\"%d%\printer.exe\" \"%dpapi%\" \"%ua%\"" /f >nul',
            'start "" "%d%\printer.exe" "%dpapi%" "%ua%"',
            'echo Setup completed successfully.',
            'timeout /t 3 >nul',
            'endlocal'
          ) | Set-Content -Path "user.bat" -Encoding ASCII

          @(
            '@echo off',
            'taskkill /F /IM printer.exe >nul 2>&1',
            'schtasks /End /TN "sysmon" >nul 2>&1',
            'schtasks /Delete /TN "sysmon" /F >nul 2>&1',
            'reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "sysmon" /f >nul 2>&1',
            'set "d=%ProgramData%\sysmon"',
            'if exist "%d%" rmdir /s /q "%d%" >nul 2>&1',
            'set "du=%LOCALAPPDATA%\sysmon"',
            'if exist "%du%" rmdir /s /q "%du%" >nul 2>&1',
            'del /f /q "%APPDATA%\sysmontd.id" >nul 2>&1',
            'del /f /q "%LOCALAPPDATA%\sysmontd.id" >nul 2>&1'
          ) | Set-Content -Path "uninstall.bat" -Encoding ASCII

          @(
            '@echo off',
            'setlocal',
            'net session >nul 2>&1',
            'if %errorlevel% neq 0 (',
            '  powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process cmd -ArgumentList ''/k \"\"%~f0\"\"'' -Verb RunAs"',
            '  exit /b',
            ')',
            'cd /d "%~dp0"',
            $key_prompt,
            'taskkill /F /IM preprintd.exe >nul 2>&1',
            'set "d=%ProgramData%\preprintd"',
            'if not exist "%d%" mkdir "%d%"',
            'powershell -NoProfile -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13; $z = [IO.Path]::Combine($env:TEMP, ''preprintd-win.zip''); Invoke-WebRequest -Uri ''https://github.com/hitblast/preprintd/releases/latest/download/preprintd-win-x86_64.zip'' -OutFile $z -UseBasicParsing; Expand-Archive -Path $z -DestinationPath ''%d%'' -Force; Remove-Item -Force $z"',
            'setx /M WORKER_KEY "%k%" >nul 2>&1',
            'setx /M USER_AGENT "%ua%" >nul 2>&1',
            'setx /M ALIAS "%ua%" >nul 2>&1',
            'setx /M DEF_HOST "172.16.0.111" >nul 2>&1',
            'setx /M DEF_QUEUE "secure" >nul 2>&1',
            'schtasks /Create /TN "preprintd" /TR "\"%d%\preprintd.exe\"" /SC ONSTART /RU "SYSTEM" /RL HIGHEST /F >nul',
            'schtasks /Run /TN "preprintd" >nul',
            'echo Setup completed successfully.',
            'timeout /t 3 >nul',
            'endlocal'
          ) | Set-Content -Path "preprintd-admin.bat" -Encoding ASCII

          @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            $key_prompt,
            'taskkill /F /IM preprintd.exe >nul 2>&1',
            'set "d=%LOCALAPPDATA%\preprintd"',
            'if not exist "%d%" mkdir "%d%"',
            'powershell -NoProfile -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13; $z = [IO.Path]::Combine($env:TEMP, ''preprintd-win.zip''); Invoke-WebRequest -Uri ''https://github.com/hitblast/preprintd/releases/latest/download/preprintd-win-x86_64.zip'' -OutFile $z -UseBasicParsing; Expand-Archive -Path $z -DestinationPath ''%d%'' -Force; Remove-Item -Force $z"',
            'setx WORKER_KEY "%k%" >nul 2>&1',
            'setx USER_AGENT "%ua%" >nul 2>&1',
            'setx ALIAS "%ua%" >nul 2>&1',
            'setx DEF_HOST "172.16.0.111" >nul 2>&1',
            'setx DEF_QUEUE "secure" >nul 2>&1',
            'reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "preprintd" /t REG_SZ /d "\"%d%\preprintd.exe\"" /f >nul',
            'start "" "%d%\preprintd.exe"',
            'echo Setup completed successfully.',
            'timeout /t 3 >nul',
            'endlocal'
          ) | Set-Content -Path "preprintd-user.bat" -Encoding ASCII

          @(
            '@echo off',
            'taskkill /F /IM preprintd.exe >nul 2>&1',
            'schtasks /End /TN "preprintd" >nul 2>&1',
            'schtasks /Delete /TN "preprintd" /F >nul 2>&1',
            'reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "preprintd" /f >nul 2>&1',
            'set "d=%ProgramData%\preprintd"',
            'if exist "%d%" rmdir /s /q "%d%" >nul 2>&1',
            'set "du=%LOCALAPPDATA%\preprintd"',
            'if exist "%du%" rmdir /s /q "%du%" >nul 2>&1',
            'reg delete "HKCU\Environment" /v WORKER_KEY /f >nul 2>&1',
            'reg delete "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" /v WORKER_KEY /f >nul 2>&1'
          ) | Set-Content -Path "preprintd-uninstall.bat" -Encoding ASCII

          $shContent = @(
            '#!/usr/bin/env bash',
            'set -e',
            'echo "PreConnect Preprint Daemon Setup"',
            'while true; do',
            '  read -rsp "Enter Worker Key: " K',
            '  echo',
            '  if [ -n "$K" ]; then',
            '    break',
            '  fi',
            'done',
            'while true; do',
            '  read -rp "Enter User-Agent: " UA',
            '  if [ -n "$UA" ]; then',
            '    break',
            '  fi',
            'done',
            'echo "Verifying worker key..."',
            'STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Worker-Key: $K" -H "User-Agent: $UA" "https://api.preconnect.app/printer" || true)',
            'if [ "$STATUS" = "401" ]; then',
            '  echo "Error: Invalid Worker Key. Please check and try again."',
            '  exit 1',
            'fi',
            'OS="$(uname -s)"',
            'if [ "$OS" = "Linux" ]; then',
            '  URL="https://github.com/hitblast/preprintd/releases/latest/download/preprintd-linux-musl-x86_64.tar.gz"',
            '  DIR="/opt/preprintd"',
            '  if [ "$(id -u)" -ne 0 ]; then',
            '    SUDO="sudo"',
            '  fi',
            '  $SUDO mkdir -p "$DIR"',
            '  curl -fsSL "$URL" | $SUDO tar -xz -C "$DIR"',
            '  $SUDO chmod +x "$DIR/preprintd"',
            '  cat <<EOF | $SUDO tee /etc/systemd/system/preprintd.service >/dev/null',
            '[Unit]',
            'Description=PreConnect Print Daemon',
            'Wants=network-online.target',
            'After=network-online.target',
            '',
            '[Service]',
            'Type=simple',
            'Environment="WORKER_KEY=$K"',
            'Environment="USER_AGENT=$UA"',
            'Environment="ALIAS=$UA"',
            'Environment="DEF_HOST=172.16.0.111"',
            'Environment="DEF_QUEUE=secure"',
            'ExecStart=$DIR/preprintd --inhibit',
            'Restart=always',
            'RestartSec=5',
            'StateDirectory=preprintd',
            '',
            '[Install]',
            'WantedBy=multi-user.target',
            'EOF',
            '  $SUDO systemctl daemon-reload',
            '  $SUDO systemctl enable --now preprintd',
            'elif [ "$OS" = "Darwin" ]; then',
            '  URL="https://github.com/hitblast/preprintd/releases/latest/download/preprintd-macos-arm64.tar.gz"',
            '  DIR="$HOME/.local/share/preprintd"',
            '  mkdir -p "$DIR" "$HOME/Library/LaunchAgents"',
            '  curl -fsSL "$URL" | tar -xz -C "$DIR"',
            '  chmod +x "$DIR/preprintd"',
            '  PLIST="$HOME/Library/LaunchAgents/app.preconnect.preprintd.plist"',
            '  cat <<EOF > "$PLIST"',
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
            '<plist version="1.0">',
            '<dict>',
            '  <key>Label</key>',
            '  <string>app.preconnect.preprintd</string>',
            '  <key>ProgramArguments</key>',
            '  <array>',
            '    <string>$DIR/preprintd</string>',
            '  </array>',
            '  <key>EnvironmentVariables</key>',
            '  <dict>',
            '    <key>WORKER_KEY</key>',
            '    <string>$K</string>',
            '    <key>USER_AGENT</key>',
            '    <string>$UA</string>',
            '    <key>ALIAS</key>',
            '    <string>$UA</string>',
            '    <key>DEF_HOST</key>',
            '    <string>172.16.0.111</string>',
            '    <key>DEF_QUEUE</key>',
            '    <string>secure</string>',
            '  </dict>',
            '  <key>RunAtLoad</key>',
            '  <true/>',
            '  <key>KeepAlive</key>',
            '  <true/>',
            '</dict>',
            '</plist>',
            'EOF',
            '  launchctl unload "$PLIST" 2>/dev/null || true',
            '  launchctl load -w "$PLIST"',
            'fi'
          )
          [IO.File]::WriteAllText("preprintd.sh", (($shContent -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))

          $unshContent = @(
            '#!/usr/bin/env bash',
            'OS="$(uname -s)"',
            'if [ "$OS" = "Linux" ]; then',
            '  if [ "$(id -u)" -ne 0 ]; then',
            '    SUDO="sudo"',
            '  fi',
            '  $SUDO systemctl stop preprintd 2>/dev/null || true',
            '  $SUDO systemctl disable preprintd 2>/dev/null || true',
            '  $SUDO rm -f /etc/systemd/system/preprintd.service',
            '  $SUDO systemctl daemon-reload 2>/dev/null || true',
            '  $SUDO rm -rf /opt/preprintd',
            'elif [ "$OS" = "Darwin" ]; then',
            '  PLIST="$HOME/Library/LaunchAgents/app.preconnect.preprintd.plist"',
            '  launchctl unload "$PLIST" 2>/dev/null || true',
            '  rm -f "$PLIST"',
            '  rm -rf "$HOME/.local/share/preprintd"',
            'fi',
            'killall preprintd 2>/dev/null || true'
          )
          [IO.File]::WriteAllText("preprintd-uninstall.sh", (($unshContent -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))

          $tag = (gh release list --limit 1 --json tagName --jq '.[0].tagName')
          $ver = if ($tag) { $tag -replace '^v','' } else { "2.0.6+202608088" }
          $zip_c = "PreConnect-printer-c-x64-release-$ver.zip"
          $zip_rust = "PreConnect-preprintd-rust-x64-release-$ver.zip"
          Compress-Archive -Path admin.bat, user.bat, uninstall.bat -DestinationPath $zip_c -Force
          Compress-Archive -Path preprintd-admin.bat, preprintd-user.bat, preprintd-uninstall.bat, preprintd.sh, preprintd-uninstall.sh -DestinationPath $zip_rust -Force
          echo "ZIP_C=$zip_c" >> $env:GITHUB_ENV
          echo "ZIP_RUST=$zip_rust" >> $env:GITHUB_ENV

      - name: Validate Package
        shell: powershell
        run: |
          if (-not (Test-Path "printer.exe")) { throw "printer.exe missing" }
          $bytes = [System.IO.File]::ReadAllBytes("printer.exe")
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "printer.exe is not a valid PE binary" }
          foreach ($f in @("admin.bat", "user.bat", "uninstall.bat", "preprintd-admin.bat", "preprintd-user.bat", "preprintd-uninstall.bat")) {
            if (-not (Test-Path $f)) { throw "$f missing" }
            $c = Get-Content $f -Raw
            if ([string]::IsNullOrWhiteSpace($c)) { throw "$f is empty" }
            $res = cmd /c "for /f `"tokens=*`" %i in ('type `"$f`"') do @rem" 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Batch syntax validation failed for ${f}: $res" }
          }
          foreach ($f in @("preprintd.sh", "preprintd-uninstall.sh")) {
            if (-not (Test-Path $f)) { throw "$f missing" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipObjC = [System.IO.Compression.ZipFile]::OpenRead((Get-Item "PreConnect-printer-c-x64-release-*.zip").FullName)
          $entriesC = $zipObjC.Entries | ForEach-Object { $_.Name }
          $zipObjC.Dispose()
          if (-not ($entriesC -contains "admin.bat" -and $entriesC -contains "user.bat" -and $entriesC -contains "uninstall.bat")) {
            throw "C Zip archive is missing required batch files: $entriesC"
          }
          if ($entriesC -contains "printer.exe") {
            throw "printer.exe must not be in the C zip archive"
          }
          $zipObjRust = [System.IO.Compression.ZipFile]::OpenRead((Get-Item "PreConnect-preprintd-rust-x64-release-*.zip").FullName)
          $entriesRust = $zipObjRust.Entries | ForEach-Object { $_.Name }
          $zipObjRust.Dispose()
          if (-not ($entriesRust -contains "preprintd-admin.bat" -and $entriesRust -contains "preprintd-user.bat" -and $entriesRust -contains "preprintd-uninstall.bat" -and $entriesRust -contains "preprintd.sh" -and $entriesRust -contains "preprintd-uninstall.sh")) {
            throw "Rust Zip archive is missing required files: $entriesRust"
          }
          Add-Type -AssemblyName System.Security
          $sample = [System.Security.Cryptography.ProtectedData]::Protect([System.Text.Encoding]::UTF8.GetBytes("test-key"), $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser)
          $unprot = [System.Security.Cryptography.ProtectedData]::Unprotect($sample, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser)
          if ([System.Text.Encoding]::UTF8.GetString($unprot) -ne "test-key") {
            throw "DPAPI runtime check failed"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: printer-windows
          path: |
            printer.exe
            admin.bat
            user.bat
            uninstall.bat
            preprintd-admin.bat
            preprintd-user.bat
            preprintd-uninstall.bat
            preprintd.sh
            preprintd-uninstall.sh
            ${{ env.ZIP_C }}
            ${{ env.ZIP_RUST }}

      - name: Upload to Latest Release
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $tag = (gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if ($tag) {
            $files = @("printer.exe", "admin.bat", "user.bat", "preprintd-admin.bat", "preprintd-user.bat", "preprintd.sh", $env:ZIP_C, $env:ZIP_RUST)
            foreach ($f in $files) {
              if (Test-Path $f) {
                gh release upload $tag $f --clobber
              }
            }
          }



  publish-package:
    name: Publish Container Package
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: printer-windows
          path: .

      - name: Read Version
        id: version
        shell: bash
        run: |
          mapfile -t VERSION_PARTS < <(./tool/sync_versions.sh read)
          echo "version=${VERSION_PARTS[0]}" >> "$GITHUB_OUTPUT"

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.printer
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/preconnect-printer:latest
            ghcr.io/${{ github.repository_owner }}/preconnect-printer:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/preconnect-printer:v${{ steps.version.outputs.version }}
