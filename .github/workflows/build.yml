name: Build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: chrome_extension
            name: Chrome Extension
            allow_failure: false
          - os: ubuntu-22.04
            platform: android
            name: Android
            allow_failure: false
          - os: macos-latest
            platform: ios
            name: iOS
            allow_failure: false
          - os: macos-latest
            platform: macos
            name: macOS
            allow_failure: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Setup Xcode
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest"

      - name: Show Xcode
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache Pub
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/.pub-cache
            C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/build.gradle*', 'android/**/settings.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Android Props
        if: matrix.platform == 'android'
        shell: bash
        run: |
          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            elif [ -n "${ANDROID_HOME:-}" ]; then
              printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            fi
          } > android/local.properties

      - name: Refresh Gradle
        if: matrix.platform == 'android'
        shell: bash
        run: |
          cd android
          ./gradlew --no-daemon help --refresh-dependencies

      - name: Cache Build
        uses: actions/cache@v5.0.3
        with:
          path: |
            build
            .dart_tool
          key: ${{ runner.os }}-${{ matrix.platform }}-flutter-build-${{ hashFiles('pubspec.lock', 'tool/build_chrome_extension.sh', 'web/**', 'lib/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-flutter-build-

      - name: Flutter Pub Get
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            flutter pub get && break
            echo "flutter pub get failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((5 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "flutter pub get failed after 3 attempts."
            exit 1
          fi

      - name: Chrome Extension
        if: matrix.platform == 'chrome_extension'
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            ./tool/build_chrome_extension.sh && break
            echo "Chrome extension build failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((10 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "Chrome extension build failed after 3 attempts."
            exit 1
          fi

      - name: Clean Build
        if: matrix.platform == 'android' || matrix.platform == 'ios' || matrix.platform == 'macos'
        shell: bash
        run: |
          flutter clean
          if [ "${{ matrix.platform }}" = "android" ]; then
            cd android
            ./gradlew clean
          fi

      - name: Android APK
        if: matrix.platform == 'android'
        shell: bash
        run: flutter build apk --release

      - name: Android AAB
        if: matrix.platform == 'android'
        shell: bash
        run: flutter build appbundle --release

      - name: iOS App
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            flutter build ios --release --no-codesign && break
            echo "iOS no-codesign build failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((10 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "iOS no-codesign build failed after 3 attempts."
            exit 1
          fi

      - name: macOS App
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            flutter build macos --release && break
            echo "macOS build failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((10 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "macOS build failed after 3 attempts."
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/chrome-extension/
            build/ios/iphoneos/
            build/macos/Build/Products/Release/
          if-no-files-found: ignore
          retention-days: 7
