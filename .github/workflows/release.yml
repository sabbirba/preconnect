name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare-version:
    name: Prepare Version
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Auto bump pubspec versionCode
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          VERSION_NAME=${VERSION_LINE%%+*}
          VERSION_CODE=${VERSION_LINE#*+}
          if [ "$VERSION_NAME" = "$VERSION_LINE" ] || [ -z "$VERSION_CODE" ] || ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Invalid version in pubspec.yaml. Expected format: x.y.z+NNN"
            exit 1
          fi
          LAST_TAG_CODE=$(git tag --list 'v*+*' --sort=-v:refname \
            | sed -n 's/^v[^+]*+\([0-9]\+\)$/\1/p' \
            | head -n1)
          BASE_CODE="$VERSION_CODE"
          if [ -n "$LAST_TAG_CODE" ] && [ "$LAST_TAG_CODE" -gt "$BASE_CODE" ]; then
            BASE_CODE="$LAST_TAG_CODE"
          fi
          NEW_VERSION_CODE=$((BASE_CODE + 1))
          NEW_VERSION="$VERSION_NAME+$NEW_VERSION_CODE"
          perl -i -pe "s/^version:\\s*.*/version: $NEW_VERSION/" pubspec.yaml
          echo "Updated pubspec version to $NEW_VERSION (base=$BASE_CODE, latest_tag=${LAST_TAG_CODE:-none})"

      - name: Read App Version
        id: version
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          VERSION_NAME=${VERSION_LINE%%+*}
          VERSION_CODE=${VERSION_LINE#*+}
          if [ "$VERSION_NAME" = "$VERSION_LINE" ] || [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" = "0" ]; then
            echo "Invalid version in pubspec.yaml. Expected format: x.y.z+NNN"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create Release
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    needs: prepare-version
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare Release Metadata
        id: meta
        shell: bash
        run: |
          RELEASE_TAG="v${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          NOTES_FILE="release-notes.md"
          {
            echo "# PreConnect Release Notes"
            echo
            echo "## Version"
            echo "- Version: ${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "## Changes"
            if [ "$RANGE" = "HEAD" ]; then
              git log --max-count=100 --pretty=format:'- %s (%h)'
            else
              git log "$RANGE" --pretty=format:'- %s (%h)'
            fi
            echo
          } > "$NOTES_FILE"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.release_tag }}" \
            --title "PreConnect ${{ steps.meta.outputs.release_tag }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" || \
          gh release edit "${{ steps.meta.outputs.release_tag }}" \
            --title "PreConnect ${{ steps.meta.outputs.release_tag }}" \
            --notes-file release-notes.md

  deploy-web:
    name: Build Web
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    needs: [prepare-version, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --pwa-strategy=none

      - name: Remove Embedded Server Files From Web Build
        run: rm -rf build/web/server

      - name: Package Web Release
        run: |
          mkdir -p artifacts
          cd build/web
          zip -r "$GITHUB_WORKSPACE/artifacts/PreConnect-web-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.zip" .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-artifacts
          path: artifacts/*
          if-no-files-found: error

      - name: Upload Web Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.release_tag }}" artifacts/* --clobber

      - name: Set Docker Image Name
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/preconnect-web" >> "$GITHUB_ENV"
          SAFE_RELEASE_TAG="${{ needs.create-release.outputs.release_tag }}"
          SAFE_RELEASE_TAG="${SAFE_RELEASE_TAG//+/-}"
          SAFE_RELEASE_TAG="${SAFE_RELEASE_TAG//\//-}"
          SAFE_RELEASE_TAG="${SAFE_RELEASE_TAG// /-}"
          echo "SAFE_RELEASE_TAG=$SAFE_RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.SAFE_RELEASE_TAG }}

  deploy-web-vps:
    name: Deploy Web To VPS
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_PRIVATE_KEY != '' }}
    needs: [prepare-version, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Web Artifact
        uses: actions/download-artifact@v8
        with:
          name: web-artifacts
          path: artifacts

      - name: Extract Web Artifact
        shell: bash
        run: |
          mkdir -p web-build
          ZIP_FILE="$(find artifacts -type f -name '*.zip' | head -n1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Web artifact zip not found."
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d web-build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh-keyscan -p "$PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure release directories exist
        shell: bash
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh -p "$PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /var/www/preconnect-web/releases /var/www/preconnect-web/shared"

      - name: Upload web build with rsync
        shell: bash
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          RELEASE_DIR="/var/www/preconnect-web/releases/${GITHUB_SHA}"
          ssh -p "$PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p ${RELEASE_DIR}"
          rsync -az --delete -e "ssh -p $PORT" \
            web-build/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${RELEASE_DIR}/"

      - name: Switch symlink and reload Nginx
        shell: bash
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          RELEASE_DIR="/var/www/preconnect-web/releases/${GITHUB_SHA}"
          ssh -p "$PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "ln -sfn ${RELEASE_DIR} /var/www/preconnect-web/current && sudo nginx -t && sudo systemctl reload nginx"

  build-platforms:
    name: Build (${{ matrix.platform }})
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    needs: [prepare-version, create-release]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: android
            allow_failure: false
          - os: macos-latest
            platform: ios
            allow_failure: true
          - os: macos-latest
            platform: macos
            allow_failure: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Set up Xcode
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Show Xcode & SDKs
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache Flutter Pub
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/.pub-cache
            C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Cache CocoaPods
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        uses: actions/cache@v5.0.3
        with:
          path: |
            ios/Pods
            macos/Pods
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/Podfile.lock', 'macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/build.gradle*', 'android/**/settings.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Flutter Build
        uses: actions/cache@v5.0.3
        with:
          path: |
            build
            .dart_tool
          key: ${{ runner.os }}-${{ matrix.platform }}-flutter-build-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-flutter-build-

      - name: Flutter Pub Get
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            flutter pub get && break
            echo "flutter pub get failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((5 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "flutter pub get failed after 3 attempts."
            exit 1
          fi

      - name: Check Android Signing Secrets
        if: matrix.platform == 'android'
        id: android_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEYSTORE_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "Android signing secrets missing; skipping Android release builds."
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore Android Keystore
        if: matrix.platform == 'android' && steps.android_signing.outputs.enabled == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/preconnect-release-key.jks
          chmod 600 android/preconnect-release-key.jks
          cat > android/key.properties <<EOF
          storeFile=preconnect-release-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android APK (Release)
        if: matrix.platform == 'android' && steps.android_signing.outputs.enabled == 'true'
        run: flutter build apk --release --build-name ${{ needs.prepare-version.outputs.version_name }} --build-number ${{ needs.prepare-version.outputs.version_code }}

      - name: Build Android AAB (Release)
        if: matrix.platform == 'android' && steps.android_signing.outputs.enabled == 'true'
        run: flutter build appbundle --release --build-name ${{ needs.prepare-version.outputs.version_name }} --build-number ${{ needs.prepare-version.outputs.version_code }}

      - name: Build iOS App (Release, No Codesign)
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign

      - name: Build iOS IPA (Release, Signed)
        if: matrix.platform == 'ios'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_P12_PASSWORD" ] || [ -z "$IOS_PROFILE_BASE64" ]; then
            echo "iOS signing secrets missing; skipping IPA export."
            exit 0
          fi
          if [ ! -f ios/ExportOptions.plist ]; then
            echo "Missing ios/ExportOptions.plist; skipping IPA export."
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "${{ secrets.IOS_P12_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "${{ secrets.IOS_P12_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Build macOS App
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release


      - name: Package Android Release
        if: matrix.platform == 'android' && steps.android_signing.outputs.enabled == 'true'
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            artifacts/PreConnect-android-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.apk
          cp build/app/outputs/bundle/release/app-release.aab \
            artifacts/PreConnect-android-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.aab

      - name: Package iOS Release
        if: matrix.platform == 'ios'
        run: |
          mkdir -p artifacts
          if ls build/ios/ipa/*.ipa >/dev/null 2>&1; then
            IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n1)
            cp "$IPA_PATH" \
              "artifacts/PreConnect-ios-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.ipa"
            exit 0
          fi
          if [ ! -d build/ios/iphoneos ]; then
            echo "No iOS build output directory found"
            exit 0
          fi
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -type d -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No iOS .ipa or .app found"
            exit 0
          fi
          IPA_NAME="PreConnect-ios-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}-unsigned.ipa"
          rm -rf Payload
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/$(basename "$APP_PATH")"
          (cd Payload && zip -r -y "$GITHUB_WORKSPACE/artifacts/$IPA_NAME" .) || true

      - name: Package macOS Release
        if: matrix.platform == 'macos'
        run: |
          mkdir -p artifacts
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No macOS .app found"
            exit 0
          fi
          DMG_NAME="PreConnect-macos-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.dmg"
          hdiutil create -volname "PreConnect" -srcfolder "$APP_PATH" -ov -format UDZO "$GITHUB_WORKSPACE/artifacts/$DMG_NAME"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-artifacts
          path: artifacts/*
          if-no-files-found: ignore

      - name: Upload Release Assets
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -d artifacts ] && find artifacts -type f -print -quit | grep -q .; then
            gh release upload "${{ needs.create-release.outputs.release_tag }}" artifacts/* --clobber
          else
            echo "No packaged artifacts for ${{ matrix.platform }}."
          fi

  publish-google-play:
    name: Publish Google Play Open Testing (Android)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    needs: [prepare-version, build-platforms]
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Android package
        id: android_meta
        shell: bash
        run: |
          PACKAGE_NAME=$(grep -E 'applicationId\s*=' android/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: android-artifacts
          path: artifacts/android

      - name: Resolve AAB file
        id: aab
        shell: bash
        run: |
          AAB_FILE=$(find artifacts/android -type f -name "*.aab" | head -n1 || true)
          if [ -z "$AAB_FILE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .aab file found in downloaded artifacts."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "file=$AAB_FILE" >> "$GITHUB_OUTPUT"
          echo "Using AAB: $AAB_FILE"

      - name: Check Google Play credentials
        id: play_auth
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing."
          fi

      - name: Validate Google Play publish prerequisites
        shell: bash
        run: |
          if [ "${{ steps.aab.outputs.found }}" != "true" ]; then
            echo "Android .aab artifact is missing. Ensure Android release build/signing succeeded."
            exit 1
          fi
          if [ "${{ steps.play_auth.outputs.enabled }}" != "true" ]; then
            echo "Missing required secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Generate Play release notes from commits
        id: play_notes
        shell: bash
        run: |
          NOTES_DIR="play-whatsnew"
          rm -rf "$NOTES_DIR"
          mkdir -p "$NOTES_DIR"

          NOTES="Automated publishing for version ${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}."

          NOTES=$(printf '%s\n' "$NOTES" | awk -v max=480 '
            BEGIN { len = 0 }
            {
              add = length($0) + (len > 0 ? 1 : 0)
              if (len + add <= max) {
                if (len > 0) printf "\n"
                printf "%s", $0
                len += add
              } else {
                exit
              }
            }
            END {
              if (len > 0) printf "\n"
            }
          ')

          printf '%s' "$NOTES" > "$NOTES_DIR/whatsnew-en-US"

          echo "dir=$NOTES_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload AAB to Google Play (Open testing)
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.android_meta.outputs.package_name }}
          releaseFiles: ${{ steps.aab.outputs.file }}
          track: beta
          status: completed
          releaseName: PreConnect v${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}
          changesNotSentForReview: false
          whatsNewDirectory: ${{ steps.play_notes.outputs.dir }}
