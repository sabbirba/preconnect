name: Release

on:
  push:
    paths:
      - "**.dart"
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * 4"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-pending:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Pending Commits
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_AUTHOR="$(git log -1 --pretty=format:%an)"
          HEAD_EMAIL="$(git log -1 --pretty=format:%ae)"
          HEAD_SUBJECT="$(git log -1 --pretty=format:%s)"
          if [ "$HEAD_AUTHOR" = "github-actions[bot]" ] && \
             [ "$HEAD_EMAIL" = "github-actions[bot]@users.noreply.github.com" ] && \
             [[ "$HEAD_SUBJECT" == chore:\ bump\ version\ to* ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$LAST_TAG" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG_SHA=$(git rev-list -n 1 "$LAST_TAG")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" = "$LAST_TAG_SHA" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  prepare-version:
    name: Prepare Version
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: detect-pending
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_sha: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump Version
        shell: bash
        run: ./tool/sync_versions.sh bump-release

      - name: Read Version
        id: version
        shell: bash
        run: |
          mapfile -t VERSION_PARTS < <(./tool/sync_versions.sh read)
          VERSION_NAME="${VERSION_PARTS[0]}"
          VERSION_CODE="${VERSION_PARTS[1]}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create Release
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    needs: [detect-pending, prepare-version]
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 0

      - name: Release Metadata
        id: meta
        shell: bash
        run: |
          RELEASE_TAG="v${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          NOTES_FILE="release-notes.md"
          {
            echo "# PreConnect Release Notes"
            echo
            echo "## Version"
            echo "- Version: ${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
            echo "- Commit: ${{ needs.prepare-version.outputs.release_sha }}"
            echo
            echo "## Changes"
            if [ "$RANGE" = "HEAD" ]; then
              git log --max-count=100 --pretty=format:'- %s (%h)'
            else
              git log "$RANGE" --pretty=format:'- %s (%h)'
            fi
            echo
          } > "$NOTES_FILE"

      - name: GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.release_tag }}" \
            --title "PreConnect ${{ steps.meta.outputs.release_tag }}" \
            --notes-file release-notes.md \
            --target "${{ needs.prepare-version.outputs.release_sha }}" || \
          gh release edit "${{ steps.meta.outputs.release_tag }}" \
            --title "PreConnect ${{ steps.meta.outputs.release_tag }}" \
            --notes-file release-notes.md \
            --target "${{ needs.prepare-version.outputs.release_sha }}"

  build:
    name: Build ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: [detect-pending, prepare-version, create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 90 }}
    permissions:
      contents: write
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      storeFile: preconnect-release-key.jks
      storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      keyAlias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: chrome_extension
            name: Chrome Extension
            artifact_name: chrome_extension-artifacts
            timeout: 30
          - os: ubuntu-latest
            platform: web
            name: Web
            artifact_name: web-artifacts
            timeout: 30
          - os: ubuntu-22.04
            platform: android
            build_type: apk
            name: Android APK
            artifact_name: android_apk-artifacts
            timeout: 50
          - os: ubuntu-22.04
            platform: android
            build_type: aab
            name: Android AAB
            artifact_name: android_aab-artifacts
            timeout: 50
          - os: macos-latest
            platform: ios
            name: iOS
            artifact_name: ios-artifacts
            timeout: 90
          - os: macos-latest
            platform: macos
            name: macOS
            artifact_name: macos-artifacts
            timeout: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 1

      - name: Bump Version
        shell: bash
        run: ./tool/sync_versions.sh bump-release

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"

      - name: Setup Xcode
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "latest"

      - name: Setup CocoaPods
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        shell: bash
        run: sudo gem install cocoapods --no-document

      - name: Android Local Properties
        if: matrix.platform == 'android'
        shell: bash
        run: |
          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            elif [ -n "${ANDROID_HOME:-}" ]; then
              printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            fi
            NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
            if [ -n "$NDK_DIR" ] && [ ! -d "$NDK_DIR" ]; then
              echo "Configured Android NDK path does not exist: ${NDK_DIR}" >&2
              exit 1
            fi
          } > android/local.properties

      - name: Flutter Pub Get
        shell: bash
        run: flutter pub get

      - name: Release Env
        shell: bash
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" > .env
          echo "DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }}" >> .env

      - name: Build Chrome Extension
        if: matrix.platform == 'chrome_extension'
        shell: bash
        run: ./tool/build_extension.sh

      - name: Package Chrome Extension
        if: matrix.platform == 'chrome_extension'
        run: |
          mkdir -p artifacts
          cd build/chrome-extension
          zip -r "$GITHUB_WORKSPACE/artifacts/PreConnect-chrome-extension-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.zip" .

      - name: Package Firefox Extension
        if: matrix.platform == 'chrome_extension'
        run: |
          mkdir -p artifacts
          cd build/firefox-extension
          zip -r "$GITHUB_WORKSPACE/artifacts/PreConnect-firefox-extension-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.zip" .

      - name: Build Web
        if: matrix.platform == 'web'
        shell: bash
        run: |
          flutter build web --release --tree-shake-icons --csp --no-wasm-dry-run --no-web-resources-cdn --dart-define-from-file=.env

      - name: Package Web
        if: matrix.platform == 'web'
        run: |
          mkdir -p artifacts
          cd build/web
          zip -r "$GITHUB_WORKSPACE/artifacts/PreConnect-web-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.zip" .



      - name: Pod Install
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            cd ios && pod update
          else
            cd macos && pod update
          fi

      - name: Restore Keystore
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEYSTORE_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets missing; skipping keystore restore."
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/preconnect-release-key.jks
          chmod 600 android/preconnect-release-key.jks
          cat > android/key.properties <<EOF
          storeFile=preconnect-release-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android APK
        if: matrix.platform == 'android' && matrix.build_type == 'apk'
        shell: bash
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --tree-shake-icons --obfuscate --split-debug-info=build/symbols/android --extra-gen-snapshot-options=--strip --dart-define-from-file=.env --build-name ${{ needs.prepare-version.outputs.version_name }} --build-number ${{ needs.prepare-version.outputs.version_code }}

      - name: Build Android AAB
        if: matrix.platform == 'android' && matrix.build_type == 'aab'
        shell: bash
        run: |
          set -euo pipefail
          if ! flutter build appbundle --release --target-platform android-arm,android-arm64 --tree-shake-icons --obfuscate --split-debug-info=build/symbols/android --extra-gen-snapshot-options=--strip --dart-define-from-file=.env --build-name ${{ needs.prepare-version.outputs.version_name }} --build-number ${{ needs.prepare-version.outputs.version_code }}; then
            echo "Flutter appbundle failed; retrying with Gradle." >&2
            cd android
            ./gradlew bundleRelease --no-daemon --stacktrace --info
          fi

      - name: Build iOS
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          flutter build ios --release --no-codesign --tree-shake-icons --obfuscate --split-debug-info=build/symbols/ios --extra-gen-snapshot-options=--strip --dart-define-from-file=.env
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -type d -name "*.app" | head -n1)
          if [ -d "$APP_PATH" ]; then
            strip -x "$APP_PATH/Runner" || true
            strip -x "$APP_PATH/Frameworks/App.framework/App" || true
          fi

      - name: Detect iOS Signing
        id: ios_signing
        if: matrix.platform == 'ios'
        shell: bash
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$DEVELOPMENT_TEAM" ] && [ -n "$IOS_P12_BASE64" ] && \
             [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export iOS IPA
        if: matrix.platform == 'ios' && steps.ios_signing.outputs.enabled == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_P12_PASSWORD" ] || [ -z "$IOS_PROFILE_BASE64" ]; then
            echo "iOS signing secrets missing; continuing with unsigned artifact."
            exit 0
          fi
          [ -f ios/ExportOptions.plist ] || { echo "Missing required file: ios/ExportOptions.plist"; exit 1; }
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$IOS_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/PreConnect.mobileprovision"
          flutter build ipa --release --tree-shake-icons --obfuscate --split-debug-info=build/symbols/ios --extra-gen-snapshot-options=--strip --dart-define-from-file=.env --export-options-plist=ios/ExportOptions.plist

      - name: Upload iOS to TestFlight
        if: matrix.platform == 'ios' && steps.ios_signing.outputs.enabled == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "App Store Connect API secrets missing; skipping TestFlight upload."
            exit 0
          fi
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -type f -name "*.ipa" | head -n1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found; skipping TestFlight upload."
            exit 0
          fi
          bundle exec fastlane ios upload_to_testflight \
            ipa:"$IPA_PATH" \
            api_key_path:"$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            api_key_id:"$APP_STORE_CONNECT_KEY_ID" \
            api_issuer_id:"$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload macOS to App Store Connect
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "App Store Connect API secrets missing; skipping macOS App Store upload."
            exit 0
          fi
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          PKG_PATH=$(find "$RUNNER_TEMP/macos_export" -maxdepth 2 -name "*.pkg" 2>/dev/null | head -n1 || true)
          if [ -n "$PKG_PATH" ] && [ -f "$PKG_PATH" ]; then
            bundle exec fastlane macos upload_to_app_store \
              pkg:"$PKG_PATH" \
              api_key_path:"$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
              api_key_id:"$APP_STORE_CONNECT_KEY_ID" \
              api_issuer_id:"$APP_STORE_CONNECT_ISSUER_ID"
          else
            echo "No .pkg found in export; skipping macOS App Store upload."
          fi

      - name: Detect macOS Signing
        id: macos_signing
        if: matrix.platform == 'macos'
        shell: bash
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$DEVELOPMENT_TEAM" ] && [ -n "$IOS_P12_BASE64" ] && \
             [ -n "$IOS_P12_PASSWORD" ] && [ -n "$MACOS_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup macOS Keychain and Provisioning
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$IOS_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$MACOS_PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/PreConnect_for_Mac.provisionprofile"

      - name: Build macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          flutter build macos --config-only --dart-define-from-file=.env

          if [ "${{ steps.macos_signing.outputs.enabled }}" = "true" ]; then
            xcodebuild archive \
              -workspace macos/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/PreConnect.xcarchive" \
              CODE_SIGN_STYLE=Manual \
              "CODE_SIGN_IDENTITY[sdk=macosx*]=3rd Party Mac Developer Application" \
              "DEVELOPMENT_TEAM[sdk=macosx*]=${{ secrets.DEVELOPMENT_TEAM }}" \
              "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]=PreConnect for Mac"

            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              '  <key>method</key><string>app-store</string>' \
              '  <key>signingStyle</key><string>manual</string>' \
              '  <key>teamID</key><string>${{ secrets.DEVELOPMENT_TEAM }}</string>' \
              '  <key>provisioningProfiles</key><dict>' \
              '    <key>com.sabbirba.preconnect</key><string>PreConnect for Mac</string>' \
              '  </dict>' \
              '  <key>uploadBitcode</key><false/>' \
              '  <key>uploadSymbols</key><true/>' \
              '</dict></plist>' \
              > "$RUNNER_TEMP/ExportOptionsMacOS.plist"

            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/PreConnect.xcarchive" \
              -exportPath "$RUNNER_TEMP/macos_export" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsMacOS.plist"
          else
            xcodebuild archive \
              -workspace macos/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/PreConnect.xcarchive" \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="-"

            APP_PATH=$(find "$RUNNER_TEMP/PreConnect.xcarchive" -type d -name "*.app" | head -n1)
            if [ -d "$APP_PATH" ]; then
              strip -x "$APP_PATH/Contents/Frameworks/App.framework/Versions/Current/App" || true
              strip -x "$APP_PATH/Contents/MacOS/PreConnect" || true
              mkdir -p "$RUNNER_TEMP/macos_export"
              cp -R "$APP_PATH" "$RUNNER_TEMP/macos_export/"
            fi
          fi

      - name: Package Android APK
        if: matrix.platform == 'android' && matrix.build_type == 'apk'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          apk_paths=(build/app/outputs/flutter-apk/app-*-release.apk)
          shopt -u nullglob
          if [ "${#apk_paths[@]}" -eq 0 ]; then
            echo "No ABI split APKs found." >&2
            exit 1
          fi
          for apk_path in "${apk_paths[@]}"; do
            abi="$(basename "$apk_path" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk_path" \
              "artifacts/PreConnect-android-${abi}-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.apk"
          done

      - name: Package Android AAB
        if: matrix.platform == 'android' && matrix.build_type == 'aab'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp build/app/outputs/bundle/release/app-release.aab \
            artifacts/PreConnect-android-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.aab

      - name: Package iOS
        if: matrix.platform == 'ios'
        run: |
          mkdir -p artifacts
          VERSION="${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
          if ls build/ios/ipa/*.ipa > /dev/null 2>&1; then
            IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n1)
            cp "$IPA_PATH" "artifacts/PreConnect-ios-release-${VERSION}.ipa"
            exit 0
          fi
          if [ ! -d build/ios/iphoneos ]; then
            echo "No iOS build output directory found"; exit 0
          fi
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -type d -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No iOS .ipa or .app found"; exit 0
          fi
          rm -rf Payload && mkdir -p Payload
          ditto "$APP_PATH" "Payload/$(basename "$APP_PATH")"
          (cd Payload && zip -r -9 -y "$GITHUB_WORKSPACE/artifacts/PreConnect-ios-release-${VERSION}-unsigned.ipa" .) || true

      - name: Notarize macOS
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "App Store Connect API secrets missing; skipping notarization."
            exit 0
          fi
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          PKG_PATH=$(find "$RUNNER_TEMP/macos_export" -maxdepth 2 -name "*.pkg" 2>/dev/null | head -n1 || true)
          if [ -n "$PKG_PATH" ] && [ -f "$PKG_PATH" ]; then
            xcrun notarytool submit "$PKG_PATH" \
              --key "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --wait
            xcrun stapler staple "$PKG_PATH"
            echo "NOTARIZED_PKG=$PKG_PATH" >> "$GITHUB_ENV"
          fi
          APP_PATH=$(find "$RUNNER_TEMP/macos_export" -maxdepth 3 -type d -name "*.app" 2>/dev/null | head -n1 || true)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/PreConnect.app.zip"
            xcrun notarytool submit "$RUNNER_TEMP/PreConnect.app.zip" \
              --key "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --wait
            xcrun stapler staple "$APP_PATH"
            echo "NOTARIZED_APP=$APP_PATH" >> "$GITHUB_ENV"
          fi

      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          VERSION="${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
          DMG_NAME="PreConnect-macos-release-${VERSION}.dmg"
          PKG_NAME="PreConnect-macos-release-${VERSION}.pkg"
          APP_PATH="${NOTARIZED_APP:-}"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find "$RUNNER_TEMP/macos_export" -maxdepth 3 -type d -name "*.app" 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 3 -type d -name "*.app" 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No macOS .app found"; exit 0
          fi
          hdiutil create -volname "PreConnect" -srcfolder "$APP_PATH" -ov -format UDZO "$GITHUB_WORKSPACE/artifacts/$DMG_NAME"
          PKG_PATH="${NOTARIZED_PKG:-}"
          if [ -z "$PKG_PATH" ]; then
            PKG_PATH=$(find "$RUNNER_TEMP/macos_export" -maxdepth 2 -name "*.pkg" 2>/dev/null | head -n1 || true)
          fi
          if [ -n "$PKG_PATH" ] && [ -f "$PKG_PATH" ]; then
            cp "$PKG_PATH" "$GITHUB_WORKSPACE/artifacts/$PKG_NAME"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: ignore

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -d artifacts ] && find artifacts -type f -print -quit | grep -q .; then
            gh release upload "${{ needs.create-release.outputs.release_tag }}" artifacts/* --clobber
          else
            echo "No packaged artifacts for ${{ matrix.name }}."
          fi

  publish-google-play:
    name: Publish Google Play
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    needs: [detect-pending, prepare-version, build]
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 0

      - name: Read Package Name
        id: android_meta
        shell: bash
        run: |
          PACKAGE_NAME=$(grep -E 'applicationId\s*=' android/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Android APK Artifacts
        uses: actions/download-artifact@v8
        with:
          name: android_apk-artifacts
          path: artifacts/android
        continue-on-error: true

      - name: Download Android AAB Artifacts
        uses: actions/download-artifact@v8
        with:
          name: android_aab-artifacts
          path: artifacts/android

      - name: Resolve AAB
        id: aab
        shell: bash
        run: |
          AAB_FILE=$(find artifacts/android -type f -name "*.aab" | head -n1 || true)
          if [ -z "$AAB_FILE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .aab file found in downloaded artifacts."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "file=$AAB_FILE" >> "$GITHUB_OUTPUT"
          echo "Using AAB: $AAB_FILE"

      - name: Check Play Credentials
        id: play_auth
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Prerequisites
        shell: bash
        run: |
          if [ "${{ steps.aab.outputs.found }}" != "true" ]; then
            echo "Android .aab artifact is missing. Ensure Android AAB build succeeded."
            exit 1
          fi

      - name: Generate Play Release Notes
        id: play_notes
        shell: bash
        run: |
          NOTES_DIR="fastlane/metadata/android"
          CHANGELOG_DIR="$NOTES_DIR/en-US/changelogs"
          rm -rf "$NOTES_DIR"
          mkdir -p "$CHANGELOG_DIR"

          if [ -f CHANGELOG.md ]; then
            NOTES="$(
              awk '
                /^## \[/ && !/\[Unreleased\]/ {
                  if (found) exit
                  found = 1
                  next
                }
                found && /^## \[/ { exit }
                found { print }
              ' CHANGELOG.md \
              | sed 's/^[-*] /• /' \
              | sed 's/^#+[[:space:]]*//'
            )"
          fi

          if [ -z "$(printf '%s' "${NOTES:-}" | tr -d '[:space:]')" ]; then
            NOTES="$(git log -1 --pretty=%B)"
          fi

          if [ -z "$(printf '%s' "${NOTES:-}" | tr -d '[:space:]')" ]; then
            NOTES="PreConnect ${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
          fi

          NOTES=$(printf '%s\n' "$NOTES" | awk -v max=480 '
            BEGIN { len = 0 }
            {
              add = length($0) + (len > 0 ? 1 : 0)
              if (len + add <= max) {
                if (len > 0) printf "\n"
                printf "%s", $0
                len += add
              } else {
                exit
              }
            }
            END {
              if (len > 0) printf "\n"
            }
          ')

          printf '%s' "$NOTES" > "$CHANGELOG_DIR/default.txt"
          printf '%s' "$NOTES" > "$CHANGELOG_DIR/${{ needs.prepare-version.outputs.version_code }}.txt"

          echo "dir=$NOTES_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Ruby
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        uses: ruby/setup-ruby@v1.319.0
        with:
          ruby-version: "3.3"

      - name: Install Ruby Gems
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        run: |
          gem install bundler --no-document
          bundle config set frozen false
          bundle install

      - name: Upload to Play Store
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_OPT_OUT_USAGE: "1"
        run: |
          bundle exec fastlane android upload_to_play_store \
            aab:"${{ steps.aab.outputs.file }}"

      - name: Promote to Beta
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_OPT_OUT_USAGE: "1"
        run: |
          bundle exec fastlane android promote_to_beta
