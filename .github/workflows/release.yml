name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Promotion to Production releases every Friday at 10:00 PM (Bangladesh Time)
    - cron: '00 16 * * 5'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-pending:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for unreleased commits
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No release tag found yet; scheduled run should proceed."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG_SHA=$(git rev-list -n 1 "$LAST_TAG")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" = "$LAST_TAG_SHA" ]; then
            echo "No new commits since $LAST_TAG; scheduled release is not required."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found since $LAST_TAG; scheduled release should proceed."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  prepare-version:
    name: Prepare Version
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: detect-pending
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Auto bump pubspec versionCode
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          VERSION_NAME=${VERSION_LINE%%+*}
          VERSION_CODE=${VERSION_LINE#*+}
          if [ "$VERSION_NAME" = "$VERSION_LINE" ] || [ -z "$VERSION_CODE" ] || ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Invalid version in pubspec.yaml. Expected format: x.y.z+NNN"
            exit 1
          fi
          LAST_TAG_CODE=$(git tag --list 'v*+*' --sort=-v:refname \
            | sed -n 's/^v[^+]*+\([0-9]\+\)$/\1/p' \
            | head -n1)
          BASE_CODE="$VERSION_CODE"
          if [ -n "$LAST_TAG_CODE" ] && [ "$LAST_TAG_CODE" -gt "$BASE_CODE" ]; then
            BASE_CODE="$LAST_TAG_CODE"
          fi
          NEW_VERSION_CODE=$((BASE_CODE + 1))
          NEW_VERSION="$VERSION_NAME+$NEW_VERSION_CODE"
          perl -i -pe "s/^version:\\s*.*/version: $NEW_VERSION/" pubspec.yaml
          echo "Updated pubspec version to $NEW_VERSION (base=$BASE_CODE, latest_tag=${LAST_TAG_CODE:-none})"

      - name: Read App Version
        id: version
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          VERSION_NAME=${VERSION_LINE%%+*}
          VERSION_CODE=${VERSION_LINE#*+}
          if [ "$VERSION_NAME" = "$VERSION_LINE" ] || [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" = "0" ]; then
            echo "Invalid version in pubspec.yaml. Expected format: x.y.z+NNN"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create Release
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    needs: [detect-pending, prepare-version]
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare Release Metadata
        id: meta
        shell: bash
        run: |
          RELEASE_TAG="v${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          NOTES_FILE="release-notes.md"
          {
            echo "# PreConnect Release Notes"
            echo
            echo "## Version"
            echo "- Version: ${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "## Changes"
            if [ "$RANGE" = "HEAD" ]; then
              git log --max-count=100 --pretty=format:'- %s (%h)'
            else
              git log "$RANGE" --pretty=format:'- %s (%h)'
            fi
            echo
          } > "$NOTES_FILE"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.release_tag }}" \
            --title "PreConnect ${{ steps.meta.outputs.release_tag }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" || \
          gh release edit "${{ steps.meta.outputs.release_tag }}" \
            --title "PreConnect ${{ steps.meta.outputs.release_tag }}" \
            --notes-file release-notes.md

  build-web:
    name: Build Web
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: [detect-pending, prepare-version, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Pub Get
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            flutter pub get && break
            echo "flutter pub get failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((5 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "flutter pub get failed after 3 attempts."
            exit 1
          fi

      - name: Create Web Build Env
        shell: bash
        run: |
          cat > .env <<'EOF'
          FACULTY_REVIEWS_BEARER=${{ secrets.FACULTY_REVIEWS_BEARER }}
          BANNER_AD_UNIT_ID=${{ secrets.BANNER_AD_UNIT_ID }}
          EOF

      - name: Build Web
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            flutter build web --release --dart-define-from-file=.env && break
            echo "flutter build web failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((10 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "flutter build web failed after 3 attempts."
            exit 1
          fi

      - name: Remove Embedded Server Files From Web Build
        run: rm -rf build/web/server

      - name: Package Web Release
        run: |
          mkdir -p artifacts
          cd build/web
          zip -r "$GITHUB_WORKSPACE/artifacts/PreConnect-web-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.zip" .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-artifacts
          path: artifacts/*
          if-no-files-found: error

      - name: Upload Web Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            gh release upload "${{ needs.create-release.outputs.release_tag }}" artifacts/* --clobber && break
            echo "GitHub release upload failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((8 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "GitHub release upload failed after 3 attempts."
            exit 1
          fi

  build-platforms:
    name: Build (${{ matrix.platform }})
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: [detect-pending, prepare-version, create-release]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
      ADS_APP_ID_IOS: ${{ secrets.ADS_APP_ID_IOS }}
      FACULTY_REVIEWS_BEARER: ${{ secrets.FACULTY_REVIEWS_BEARER }}
      PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
      storeFile: preconnect-release-key.jks
      storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      keyAlias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: android
            allow_failure: false
          - os: macos-latest
            platform: ios
            allow_failure: false
          - os: macos-latest
            platform: macos
            allow_failure: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Set up Xcode
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Show Xcode & SDKs
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache Flutter Pub
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/.pub-cache
            C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Cache CocoaPods
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        uses: actions/cache@v5.0.3
        with:
          path: |
            ios/Pods
            macos/Pods
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/Podfile.lock', 'macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/build.gradle*', 'android/**/settings.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create Android Local Properties
        if: matrix.platform == 'android'
        shell: bash
        run: |
          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            elif [ -n "${ANDROID_HOME:-}" ]; then
              printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            fi
          } > android/local.properties

      - name: Refresh Gradle Dependencies
        if: matrix.platform == 'android'
        shell: bash
        run: |
          cd android
          ./gradlew --no-daemon help --refresh-dependencies

      - name: Cache Flutter Build
        uses: actions/cache@v5.0.3
        with:
          path: |
            build
            .dart_tool
          key: ${{ runner.os }}-${{ matrix.platform }}-flutter-build-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-flutter-build-

      - name: Flutter Pub Get
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            flutter pub get && break
            echo "flutter pub get failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((5 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "flutter pub get failed after 3 attempts."
            exit 1
          fi

      - name: Patch flutter_alarmkit iOS Entry Point
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          target="ios/.symlinks/plugins/flutter_alarmkit/ios/Classes/AlarmLiveActivityBundle.swift"
          if [ -f "$target" ]; then
            perl -0777 -i -pe 's/\n@main\nstruct AlarmLiveActivityBundle/\nstruct AlarmLiveActivityBundle/g' "$target"
          else
            echo "flutter_alarmkit entry file not found at $target"
          fi

      - name: Refresh CocoaPods Dependencies
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            cd ios
          else
            cd macos
          fi
          attempt=1
          until [ $attempt -gt 3 ]; do
            pod install --repo-update && break
            echo "pod install --repo-update failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((10 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "pod install --repo-update failed after 3 attempts."
            exit 1
          fi

      - name: Create Release Env
        shell: bash
        run: |
          cat > .env <<'EOF'
          FACULTY_REVIEWS_BEARER=${{ secrets.FACULTY_REVIEWS_BEARER }}
          REWARDED_AD_UNIT_ID=${{ secrets.REWARDED_AD_UNIT_ID }}
          ADS_APP_ID_IOS=${{ secrets.ADS_APP_ID_IOS }}
          BANNER_AD_UNIT_ID=${{ secrets.BANNER_AD_UNIT_ID }}
          DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }}
          PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER=${{ secrets.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
          EOF

      - name: Restore Android Keystore
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEYSTORE_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets missing; skipping keystore restore."
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/preconnect-release-key.jks
          chmod 600 android/preconnect-release-key.jks
          cat > android/key.properties <<EOF
          storeFile=preconnect-release-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android APK (Release)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          flutter build apk --release --dart-define-from-file=.env --build-name ${{ needs.prepare-version.outputs.version_name }} --build-number ${{ needs.prepare-version.outputs.version_code }}

      - name: Build Android AAB (Release)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          flutter build appbundle --release --dart-define-from-file=.env --build-name ${{ needs.prepare-version.outputs.version_name }} --build-number ${{ needs.prepare-version.outputs.version_code }}

      - name: Build iOS App (Release, No Codesign)
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            flutter build ios --release --no-codesign --dart-define-from-file=.env && break
            echo "iOS no-codesign build failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((10 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "iOS no-codesign build failed after 3 attempts."
            exit 1
          fi

      - name: Detect iOS Signing Availability
        id: ios_signing
        if: matrix.platform == 'ios'
        shell: bash
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ADS_APP_ID_IOS: ${{ secrets.ADS_APP_ID_IOS }}
          REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$DEVELOPMENT_TEAM" ] && [ -n "$ADS_APP_ID_IOS" ] && [ -n "$REWARDED_AD_UNIT_ID" ] && \
             [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "iOS signing secrets detected; signed IPA export is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "iOS signing secrets missing; continuing with unsigned iOS fallback."
          fi

      - name: Build iOS IPA (Release, Signed)
        if: matrix.platform == 'ios' && steps.ios_signing.outputs.enabled == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_P12_PASSWORD" ] || [ -z "$IOS_PROFILE_BASE64" ]; then
            echo "iOS signing secrets missing; signed IPA export disabled, continuing with unsigned artifact packaging."
            exit 0
          fi
          [ -f ios/ExportOptions.plist ] || { echo "Missing required file: ios/ExportOptions.plist"; exit 1; }
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "${{ secrets.IOS_P12_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "${{ secrets.IOS_P12_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          attempt=1
          until [ $attempt -gt 3 ]; do
            flutter build ipa --release --dart-define-from-file=.env --export-options-plist=ios/ExportOptions.plist && break
            echo "iOS signed IPA build failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((10 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "iOS signed IPA build failed after 3 attempts."
            exit 1
          fi

      - name: Build macOS App
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          attempt=1
          until [ $attempt -gt 3 ]; do
            flutter build macos --release && break
            echo "macOS build failed (attempt $attempt)."
            attempt=$((attempt+1))
            sleep $((10 * attempt))
          done
          if [ $attempt -gt 3 ]; then
            echo "macOS build failed after 3 attempts."
            exit 1
          fi

      - name: Package Android Release
        if: matrix.platform == 'android'
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            artifacts/PreConnect-android-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.apk
          cp build/app/outputs/bundle/release/app-release.aab \
            artifacts/PreConnect-android-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.aab

      - name: Package iOS Release
        if: matrix.platform == 'ios'
        run: |
          mkdir -p artifacts
          if ls build/ios/ipa/*.ipa >/dev/null 2>&1; then
            IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n1)
            cp "$IPA_PATH" \
              "artifacts/PreConnect-ios-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.ipa"
            exit 0
          fi
          if [ ! -d build/ios/iphoneos ]; then
            echo "No iOS build output directory found"
            exit 0
          fi
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -type d -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No iOS .ipa or .app found"
            exit 0
          fi
          IPA_NAME="PreConnect-ios-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}-unsigned.ipa"
          rm -rf Payload
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/$(basename "$APP_PATH")"
          (cd Payload && zip -r -y "$GITHUB_WORKSPACE/artifacts/$IPA_NAME" .) || true

      - name: Package macOS Release
        if: matrix.platform == 'macos'
        run: |
          mkdir -p artifacts
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No macOS .app found"
            exit 0
          fi
          DMG_NAME="PreConnect-macos-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.dmg"
          hdiutil create -volname "PreConnect" -srcfolder "$APP_PATH" -ov -format UDZO "$GITHUB_WORKSPACE/artifacts/$DMG_NAME"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-artifacts
          path: artifacts/*
          if-no-files-found: ignore

      - name: Upload Release Assets
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -d artifacts ] && find artifacts -type f -print -quit | grep -q .; then
            attempt=1
            until [ $attempt -gt 3 ]; do
              gh release upload "${{ needs.create-release.outputs.release_tag }}" artifacts/* --clobber && break
              echo "GitHub release asset upload failed for ${{ matrix.platform }} (attempt $attempt)."
              attempt=$((attempt+1))
              sleep $((8 * attempt))
            done
            if [ $attempt -gt 3 ]; then
              echo "GitHub release asset upload failed for ${{ matrix.platform }} after 3 attempts."
              exit 1
            fi
          else
            echo "No packaged artifacts for ${{ matrix.platform }}."
          fi

  publish-google-play:
    name: Publish Google Play Release (Android)
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    needs: [detect-pending, prepare-version, build-platforms]
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Android package
        id: android_meta
        shell: bash
        run: |
          PACKAGE_NAME=$(grep -E 'applicationId\s*=' android/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: android-artifacts
          path: artifacts/android

      - name: Resolve AAB file
        id: aab
        shell: bash
        run: |
          AAB_FILE=$(find artifacts/android -type f -name "*.aab" | head -n1 || true)
          if [ -z "$AAB_FILE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .aab file found in downloaded artifacts."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "file=$AAB_FILE" >> "$GITHUB_OUTPUT"
          echo "Using AAB: $AAB_FILE"

      - name: Check Google Play credentials
        id: play_auth
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not provided."
          fi

      - name: Validate Google Play publish prerequisites
        shell: bash
        run: |
          if [ "${{ steps.aab.outputs.found }}" != "true" ]; then
            echo "Android .aab artifact is missing. Ensure Android release build/signing succeeded."
            exit 1
          fi
          if [ "${{ steps.play_auth.outputs.enabled }}" != "true" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not provided; skipping Google Play upload."
          fi

      - name: Generate Play release notes from commits
        id: play_notes
        shell: bash
        run: |
          NOTES_DIR="fastlane/metadata/android"
          CHANGELOG_DIR="$NOTES_DIR/en-US/changelogs"
          rm -rf "$NOTES_DIR"
          mkdir -p "$CHANGELOG_DIR"

          NOTES="$(git log -1 --pretty=%B)"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="PreConnect ${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
          fi

          NOTES=$(printf '%s\n' "$NOTES" | awk -v max=480 '
            BEGIN { len = 0 }
            {
              add = length($0) + (len > 0 ? 1 : 0)
              if (len + add <= max) {
                if (len > 0) printf "\n"
                printf "%s", $0
                len += add
              } else {
                exit
              }
            }
            END {
              if (len > 0) printf "\n"
            }
          ')

          printf '%s' "$NOTES" > "$CHANGELOG_DIR/default.txt"
          printf '%s' "$NOTES" > "$CHANGELOG_DIR/${{ needs.prepare-version.outputs.version_code }}.txt"

          echo "dir=$NOTES_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby for Fastlane
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        shell: bash
        run: gem install fastlane --no-document

      - name: Upload to Internal
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          fastlane supply \
            --aab "${{ steps.aab.outputs.file }}" \
            --package_name "${{ steps.android_meta.outputs.package_name }}" \
            --json_key_data "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" \
            --track "internal" \
            --release_status "completed" \
            --version_name "PreConnect v${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}" \
            --metadata_path "${{ steps.play_notes.outputs.dir }}" \
            --skip_upload_metadata true \
            --skip_upload_changelogs false \
            --skip_upload_images true \
            --skip_upload_screenshots true

      - name: Promote to Beta
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          fastlane supply \
            --package_name "${{ steps.android_meta.outputs.package_name }}" \
            --json_key_data "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" \
            --track "internal" \
            --track_promote_to "beta" \
            --track_promote_release_status "completed" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_metadata true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true

  promote-google-play-production:
    name: Promote Google Play Production (Weekly)
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 17 * * 4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Android package
        id: android_meta
        shell: bash
        run: |
          PACKAGE_NAME=$(grep -E 'applicationId\s*=' android/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Check Google Play Credentials
        id: play_auth
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not provided."
          fi

      - name: Set up Ruby for Fastlane
        if: steps.play_auth.outputs.enabled == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        if: steps.play_auth.outputs.enabled == 'true'
        shell: bash
        run: gem install fastlane --no-document

      - name: Promote Beta to Production
        if: steps.play_auth.outputs.enabled == 'true'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          fastlane supply \
            --package_name "${{ steps.android_meta.outputs.package_name }}" \
            --json_key_data "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" \
            --track "beta" \
            --track_promote_to "production" \
            --track_promote_release_status "completed" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_metadata true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true
