name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * 1"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTLANE_VERBOSE: "true"
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  detect-pending:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check Pending Commits
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_AUTHOR="$(git log -1 --pretty=format:%an)"
          HEAD_EMAIL="$(git log -1 --pretty=format:%ae)"
          HEAD_SUBJECT="$(git log -1 --pretty=format:%s)"
          if [ "$HEAD_AUTHOR" = "github-actions[bot]" ] && \
             [ "$HEAD_EMAIL" = "github-actions[bot]@users.noreply.github.com" ] && \
             [[ "$HEAD_SUBJECT" == chore:\ bump\ version\ to* ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$LAST_TAG" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG_SHA=$(git rev-list -n 1 "$LAST_TAG")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" = "$LAST_TAG_SHA" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  prepare-version:
    name: Prepare Version & Release
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: detect-pending
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_sha: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bump Version
        shell: bash
        run: ./tool/sync_versions.sh bump-release

      - name: Read Version
        id: version
        shell: bash
        run: |
          mapfile -t VERSION_PARTS < <(./tool/sync_versions.sh read)
          VERSION_NAME="${VERSION_PARTS[0]}"
          VERSION_CODE="${VERSION_PARTS[1]}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Release Metadata
        id: meta
        shell: bash
        run: |
          RELEASE_TAG="v${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          NOTES_FILE="release-notes.md"
          {
            echo "# PreConnect Release Notes"
            echo
            echo "## Version"
            echo "- Version: ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "## Changes"
            if [ "$RANGE" = "HEAD" ]; then
              git log --max-count=1000 --pretty=format:'- %s (%h)'
            else
              git log "$RANGE" --max-count=1000 --pretty=format:'- %s (%h)'
            fi
            echo
          } > "$NOTES_FILE"

      - name: GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.release_tag }}" \
            --title "PreConnect ${{ steps.meta.outputs.release_tag }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" || \
          gh release edit "${{ steps.meta.outputs.release_tag }}" \
            --title "PreConnect ${{ steps.meta.outputs.release_tag }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"

  static-checks:
    name: Static Analysis
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: [detect-pending, prepare-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 1
      - name: Set Up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true
      - name: Cache Dart Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Get Flutter Packages
        run: flutter pub get
      - name: Analyze Flutter Code
        run: flutter analyze

  build-web-extension:
    name: Build Web & Extension
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: [detect-pending, prepare-version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 1

      - name: Bump Version
        shell: bash
        run: ./tool/sync_versions.sh bump-release

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Cache Dart Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Get Flutter Packages
        shell: bash
        run: flutter pub get

      - name: Release Environment
        shell: bash
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" > .env

      - name: Build Browser Extension
        shell: bash
        run: ./tool/build_extension.sh --no-pub

      - name: Package Chrome Extension
        shell: bash
        run: |
          mkdir -p artifacts
          cd build/chrome-extension
          zip -r "$GITHUB_WORKSPACE/artifacts/PreConnect-chrome-extension-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.zip" .

      - name: Package Firefox Extension
        shell: bash
        run: |
          mkdir -p artifacts
          cd build/firefox-extension
          zip -r "$GITHUB_WORKSPACE/artifacts/PreConnect-firefox-extension-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.zip" .

      - name: Build Web
        shell: bash
        run: |
          flutter build web --release --tree-shake-icons --csp --no-wasm-dry-run --no-web-resources-cdn --no-pub --dart-define-from-file=.env

      - name: Package Web
        shell: bash
        run: |
          mkdir -p artifacts
          cd build/web
          zip -r "$GITHUB_WORKSPACE/artifacts/PreConnect-web-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.zip" .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web_extension-artifacts
          path: artifacts/*
          if-no-files-found: ignore

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -d artifacts ] && find artifacts -type f -print -quit | grep -q .; then
            gh release upload "${{ needs.prepare-version.outputs.release_tag }}" artifacts/* --clobber
          fi

  build-android-apk:
    name: Build Android APK
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: [detect-pending, prepare-version]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      storeFile: preconnect-release-key.jks
      storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      keyAlias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 1

      - name: Bump Version
        shell: bash
        run: ./tool/sync_versions.sh bump-release

      - name: Set Up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle Caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Write Android Local Properties
        shell: bash
        run: |
          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            elif [ -n "${ANDROID_HOME:-}" ]; then
              printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            fi
            NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
            if [ -n "$NDK_DIR" ] && [ ! -d "$NDK_DIR" ]; then
              echo "Configured Android NDK path does not exist: ${NDK_DIR}" >&2
              exit 1
            fi
          } > android/local.properties

      - name: Cache Dart Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Get Flutter Packages
        shell: bash
        run: flutter pub get

      - name: Release Environment
        shell: bash
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" > .env

      - name: Restore Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEYSTORE_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets missing; skipping keystore restore."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/preconnect-release-key.jks
          chmod 600 android/preconnect-release-key.jks
          {
            printf 'storeFile=preconnect-release-key.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEYSTORE_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        shell: bash
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --tree-shake-icons --obfuscate --no-pub --split-debug-info=build/symbols/android --extra-gen-snapshot-options=--strip --dart-define-from-file=.env --build-name ${{ needs.prepare-version.outputs.version_name }} --build-number ${{ needs.prepare-version.outputs.version_code }}

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          apk_paths=(build/app/outputs/flutter-apk/app-*-release.apk)
          shopt -u nullglob
          if [ "${#apk_paths[@]}" -eq 0 ]; then
             echo "No ABI split APKs found." >&2
             exit 1
          fi
          for apk_path in "${apk_paths[@]}"; do
             abi="$(basename "$apk_path" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
             cp "$apk_path" \
               "artifacts/PreConnect-android-${abi}-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.apk"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-apk-artifacts
          path: artifacts/*
          if-no-files-found: ignore

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -d artifacts ] && find artifacts -type f -print -quit | grep -q .; then
            gh release upload "${{ needs.prepare-version.outputs.release_tag }}" artifacts/* --clobber
          fi

  build-android-aab:
    name: Build Android AAB
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: [detect-pending, prepare-version]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      storeFile: preconnect-release-key.jks
      storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      keyAlias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 1

      - name: Bump Version
        shell: bash
        run: ./tool/sync_versions.sh bump-release

      - name: Set Up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle Caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Write Android Local Properties
        shell: bash
        run: |
          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            elif [ -n "${ANDROID_HOME:-}" ]; then
              printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            fi
            NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
            if [ -n "$NDK_DIR" ] && [ ! -d "$NDK_DIR" ]; then
              echo "Configured Android NDK path does not exist: ${NDK_DIR}" >&2
              exit 1
            fi
          } > android/local.properties

      - name: Cache Dart Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Get Flutter Packages
        shell: bash
        run: flutter pub get

      - name: Release Environment
        shell: bash
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" > .env

      - name: Restore Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEYSTORE_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets missing; skipping keystore restore."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/preconnect-release-key.jks
          chmod 600 android/preconnect-release-key.jks
          {
            printf 'storeFile=preconnect-release-key.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEYSTORE_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build AAB
        shell: bash
        run: ./tool/build_aab.sh

      - name: Package AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp build/app/outputs/bundle/release/app-release.aab \
             artifacts/PreConnect-android-release-${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}.aab

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-aab-artifacts
          path: artifacts/*
          if-no-files-found: ignore

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -d artifacts ] && find artifacts -type f -print -quit | grep -q .; then
            gh release upload "${{ needs.prepare-version.outputs.release_tag }}" artifacts/* --clobber
          fi

  build-ios:
    name: Build iOS
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: [detect-pending, prepare-version]
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 1

      - name: Bump Version
        shell: bash
        run: ./tool/sync_versions.sh bump-release

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Cache Dart Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Configure Xcode Parallel Builds
        run: |
          defaults write com.apple.dt.Xcode IDEBuildOperationMaxNumberOfConcurrentCompileJobs 4
          defaults write com.apple.dt.Xcode-CLT IDEBuildOperationMaxNumberOfConcurrentCompileJobs 4

      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Get Flutter Packages
        shell: bash
        run: flutter pub get

      - name: Release Environment
        shell: bash
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" > .env

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-deriveddata-ios-${{ hashFiles('ios/**/Package.resolved', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-ios-

      - name: Detect iOS Signing
        id: ios_signing
        shell: bash
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$DEVELOPMENT_TEAM" ] && [ -n "$IOS_P12_BASE64" ] && \
             [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Up iOS Keychain
        if: steps.ios_signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
          keychain-password: "PreConnect"

      - name: Install iOS Provisioning Profile
        if: steps.ios_signing.outputs.enabled == 'true'
        shell: bash
        env:
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/PreConnect.mobileprovision"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          TMPXML="$(mktemp /tmp/profile_XXXXXX.plist)"
          security cms -D -i "$PROFILE_PATH" > "$TMPXML" 2>/dev/null
          UUID="$(/usr/libexec/PlistBuddy -c "Print :UUID" "$TMPXML" 2>/dev/null)"
          rm -f "$TMPXML"
          if [ -z "$UUID" ]; then
            echo "Unable to read iOS provisioning profile UUID." >&2
            exit 1
          fi
          cp "$PROFILE_PATH" "$PROFILE_DIR/${UUID}.mobileprovision"

      - name: Build iOS Unsigned
        if: steps.ios_signing.outputs.enabled != 'true'
        shell: bash
        run: |
          flutter build ios --release --no-codesign --tree-shake-icons --obfuscate --no-pub \
            --split-debug-info=build/symbols/ios --extra-gen-snapshot-options=--strip \
            --dart-define-from-file=.env \
            --build-name "${{ needs.prepare-version.outputs.version_name }}" \
            --build-number "${{ needs.prepare-version.outputs.version_code }}"
          APP_PATH="$(find build/ios/iphoneos -maxdepth 1 -type d -name "*.app" | head -n1)"
          if [ -d "$APP_PATH" ]; then
            strip -x "$APP_PATH/Runner" || true
            strip -x "$APP_PATH/Frameworks/App.framework/App" || true
          fi

      - name: Build iOS IPA
        if: steps.ios_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          flutter build ipa --release --tree-shake-icons --obfuscate --no-pub \
            --split-debug-info=build/symbols/ios --extra-gen-snapshot-options=--strip \
            --dart-define-from-file=.env \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name "${{ needs.prepare-version.outputs.version_name }}" \
            --build-number "${{ needs.prepare-version.outputs.version_code }}"

      - name: Package iOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          VERSION="${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
          shopt -s nullglob
          ipa_paths=(build/ios/ipa/*.ipa)
          shopt -u nullglob
          if [ "${#ipa_paths[@]}" -gt 0 ]; then
            cp "${ipa_paths[0]}" "artifacts/PreConnect-ios-release-${VERSION}.ipa"
            exit 0
          fi
          if [ ! -d build/ios/iphoneos ]; then
            echo "No iOS build output directory found." >&2
            exit 1
          fi
          shopt -s nullglob
          app_paths=(build/ios/iphoneos/*.app)
          shopt -u nullglob
          if [ "${#app_paths[@]}" -eq 0 ]; then
            echo "No iOS .ipa or .app found." >&2
            exit 1
          fi
          PAYLOAD_ROOT="$(mktemp -d "$RUNNER_TEMP/ios_payload_XXXXXX")"
          mkdir -p "$PAYLOAD_ROOT/Payload"
          ditto "${app_paths[0]}" "$PAYLOAD_ROOT/Payload/$(basename "${app_paths[0]}")"
          (
            cd "$PAYLOAD_ROOT"
            zip -r -9 -y "$GITHUB_WORKSPACE/artifacts/PreConnect-ios-release-${VERSION}-unsigned.ipa" Payload
          )

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-artifacts
          path: artifacts/*
          if-no-files-found: ignore

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -d artifacts ] && find artifacts -type f -print -quit | grep -q .; then
            gh release upload "${{ needs.prepare-version.outputs.release_tag }}" artifacts/* --clobber
          fi

  build-macos:
    name: Build macOS
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    needs: [detect-pending, prepare-version]
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 1

      - name: Bump Version
        shell: bash
        run: ./tool/sync_versions.sh bump-release

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Cache Dart Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Configure Xcode Parallel Builds
        run: |
          defaults write com.apple.dt.Xcode IDEBuildOperationMaxNumberOfConcurrentCompileJobs 4
          defaults write com.apple.dt.Xcode-CLT IDEBuildOperationMaxNumberOfConcurrentCompileJobs 4

      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Get Flutter Packages
        shell: bash
        run: flutter pub get

      - name: Release Environment
        shell: bash
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" > .env

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-deriveddata-macos-${{ hashFiles('macos/**/Package.resolved', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-macos-

      - name: Detect macOS Signing
        id: macos_signing
        shell: bash
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
        run: |
          if [ -n "$DEVELOPMENT_TEAM" ] && [ -n "$IOS_P12_BASE64" ] && \
             [ -n "$IOS_P12_PASSWORD" ] && [ -n "$MACOS_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$MACOS_INSTALLER_P12_BASE64" ]; then
            echo "installer_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "installer_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Up macOS Keychain
        if: steps.macos_signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 || secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD || secrets.IOS_P12_PASSWORD }}
          keychain-password: "PreConnect"

      - name: Set Up macOS Installer Certificate
        if: steps.macos_signing.outputs.enabled == 'true' && steps.macos_signing.outputs.installer_enabled == 'true'
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          keychain: signing_temp
          create-keychain: false
          keychain-password: "PreConnect"

      - name: Install macOS Provisioning Profile
        if: steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
        run: |
          install_profile() {
            local dest_dir="$1"
            mkdir -p "$dest_dir"
            local profile_path="$dest_dir/PreConnect.provisionprofile"
            printf '%s' "$MACOS_PROFILE_BASE64" | base64 -d > "$profile_path"
            local tmpxml
            tmpxml="$(mktemp /tmp/profile_XXXXXX.plist)"
            security cms -D -i "$profile_path" > "$tmpxml" 2>/dev/null
            local uuid
            uuid="$(/usr/libexec/PlistBuddy -c "Print :UUID" "$tmpxml" 2>/dev/null)"
            rm -f "$tmpxml"
            if [ -z "$uuid" ]; then
              echo "Unable to read macOS provisioning profile UUID." >&2
              return 1
            fi
            cp "$profile_path" "$dest_dir/${uuid}.provisionprofile"
            echo "MACOS_PROFILE_UUID=${uuid}" >> "$GITHUB_ENV"
          }
          install_profile "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

      - name: Build macOS Application
        shell: bash
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          flutter build macos --config-only --dart-define-from-file=.env

          if [ "${{ steps.macos_signing.outputs.enabled }}" = "true" ]; then
            if security find-certificate -c "Developer ID Application" >/dev/null 2>&1; then
              STRIPPED_ENTITLEMENTS="$RUNNER_TEMP/Release_DeveloperID.entitlements"
              cp macos/Runner/Release.entitlements "$STRIPPED_ENTITLEMENTS"
              /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.associated-domains" "$STRIPPED_ENTITLEMENTS" || true
              /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$STRIPPED_ENTITLEMENTS" || true
              /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" "$STRIPPED_ENTITLEMENTS" || true

              xcodebuild archive \
                -workspace macos/Runner.xcworkspace \
                -scheme Runner \
                -configuration Release \
                -archivePath "$RUNNER_TEMP/PreConnect_DevID.xcarchive" \
                CODE_SIGN_STYLE=Manual \
                CODE_SIGN_IDENTITY="Developer ID Application" \
                DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
                PROVISIONING_PROFILE_SPECIFIER="" \
                PROVISIONING_PROFILE="" \
                CODE_SIGN_ENTITLEMENTS="$STRIPPED_ENTITLEMENTS"

               printf '%s\n' \
                '<?xml version="1.0" encoding="UTF-8"?>' \
                '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
                '<plist version="1.0"><dict>' \
                '  <key>method</key><string>developer-id</string>' \
                '  <key>signingStyle</key><string>manual</string>' \
                "  <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>" \
                '  <key>signingCertificate</key><string>Developer ID Application</string>' \
                '  <key>uploadSymbols</key><true/>' \
                '</dict></plist>' \
                > "$RUNNER_TEMP/ExportOptionsMacOS_DevID.plist"

              xcodebuild -exportArchive \
                -archivePath "$RUNNER_TEMP/PreConnect_DevID.xcarchive" \
                -exportPath "$RUNNER_TEMP/macos_export" \
                -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsMacOS_DevID.plist"

              echo "Signing Developer ID build with Developer ID Application..."
              find "$RUNNER_TEMP/macos_export/PreConnect.app" -depth -name "*.framework" -o -name "*.dylib" -o -name "*.app" | while read -r file; do
                codesign --force --options runtime --timestamp --sign "Developer ID Application" "$file" || true
              done
              codesign --force --options runtime --timestamp --sign "Developer ID Application" "$RUNNER_TEMP/macos_export/PreConnect.app"
              echo "DEVID_BUILD=true" >> "$GITHUB_ENV"
            fi

            if security find-certificate -c "Apple Distribution" >/dev/null 2>&1; then
              echo "Building for App Store Connect Distribution..."
              cp macos/Runner/Configs/Release.xcconfig "$RUNNER_TEMP/Release.xcconfig.bak"
              printf '%s\n' \
                "CODE_SIGN_STYLE = Manual" \
                "CODE_SIGN_IDENTITY = Apple Distribution" \
                "DEVELOPMENT_TEAM = ${DEVELOPMENT_TEAM}" \
                "PROVISIONING_PROFILE = ${MACOS_PROFILE_UUID}" \
                "PROVISIONING_PROFILE_SPECIFIER = " \
                >> macos/Runner/Configs/Release.xcconfig

              if xcodebuild archive \
                -workspace macos/Runner.xcworkspace \
                -scheme Runner \
                -configuration Release \
                -archivePath "$RUNNER_TEMP/PreConnect_Store.xcarchive" \
                CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES; then
                cp "$RUNNER_TEMP/Release.xcconfig.bak" macos/Runner/Configs/Release.xcconfig

                 printf '%s\n' \
                  '<?xml version="1.0" encoding="UTF-8"?>' \
                  '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
                  '<plist version="1.0"><dict>' \
                  '  <key>method</key><string>app-store-connect</string>' \
                  '  <key>signingStyle</key><string>manual</string>' \
                  "  <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>" \
                  '  <key>signingCertificate</key><string>Apple Distribution</string>' \
                  '  <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>' \
                  '  <key>provisioningProfiles</key><dict>' \
                  "    <key>com.sabbirba.preconnect</key><string>$MACOS_PROFILE_UUID</string>" \
                  '  </dict>' \
                  '  <key>uploadBitcode</key><false/>' \
                  '  <key>uploadSymbols</key><true/>' \
                  '</dict></plist>' \
                  > "$RUNNER_TEMP/ExportOptionsMacOS_Store.plist"

                 xcodebuild -exportArchive \
                   -archivePath "$RUNNER_TEMP/PreConnect_Store.xcarchive" \
                   -exportPath "$RUNNER_TEMP/macos_store_export" \
                   -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsMacOS_Store.plist"
                 echo "STORE_BUILD=true" >> "$GITHUB_ENV"
              else
                 cp "$RUNNER_TEMP/Release.xcconfig.bak" macos/Runner/Configs/Release.xcconfig || true
                 echo "macOS App Store Connect archive failed." >&2
                 exit 1
              fi
            fi

            if [ "${STORE_BUILD:-}" != "true" ] && [ "${DEVID_BUILD:-}" != "true" ]; then
              echo "No signed builds created. Falling back to unsigned build..."
              xcodebuild archive \
                -workspace macos/Runner.xcworkspace \
                -scheme Runner \
                -configuration Release \
                -archivePath "$RUNNER_TEMP/PreConnect.xcarchive" \
                CODE_SIGN_STYLE=Automatic \
                CODE_SIGN_IDENTITY="-" \
                DEVELOPMENT_TEAM="" \
                PROVISIONING_PROFILE_SPECIFIER="" \
                PROVISIONING_PROFILE=""

              APP_PATH="$(find "$RUNNER_TEMP/PreConnect.xcarchive" -type d -name "*.app" | head -n1)"
              if [ -d "$APP_PATH" ]; then
                strip -x "$APP_PATH/Contents/Frameworks/App.framework/Versions/Current/App" || true
                strip -x "$APP_PATH/Contents/MacOS/PreConnect" || true
                mkdir -p "$RUNNER_TEMP/macos_export"
                cp -R "$APP_PATH" "$RUNNER_TEMP/macos_export/"
              fi
            fi
          else
            xcodebuild archive \
              -workspace macos/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/PreConnect.xcarchive" \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="-" \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              PROVISIONING_PROFILE=""

            APP_PATH="$(find "$RUNNER_TEMP/PreConnect.xcarchive" -type d -name "*.app" | head -n1)"
            if [ -d "$APP_PATH" ]; then
              strip -x "$APP_PATH/Contents/Frameworks/App.framework/Versions/Current/App" || true
              strip -x "$APP_PATH/Contents/MacOS/PreConnect" || true
              mkdir -p "$RUNNER_TEMP/macos_export"
              cp -R "$APP_PATH" "$RUNNER_TEMP/macos_export/"
            fi
          fi

      - name: Notarize macOS
        if: steps.macos_signing.outputs.enabled == 'true' && env.DEVID_BUILD == 'true'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_STORE_CONNECT_API_KEY" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "App Store Connect API secrets missing; skipping notarization."
            exit 0
          fi

          PKG_PATH=$(find "$RUNNER_TEMP/macos_export" -maxdepth 2 -name "*.pkg" 2>/dev/null | head -n1 || true)
          if [ -n "$PKG_PATH" ] && [ -f "$PKG_PATH" ]; then
            cd macos && bundle exec fastlane notarize_app \
              package:"$PKG_PATH"
            echo "NOTARIZED_PKG=$PKG_PATH" >> "$GITHUB_ENV"
          fi

          APP_PATH=$(find "$RUNNER_TEMP/macos_export" -maxdepth 3 -type d -name "*.app" 2>/dev/null | head -n1 || true)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/PreConnect.app.zip"
            cd macos && bundle exec fastlane notarize_app \
              package:"$RUNNER_TEMP/PreConnect.app.zip"
            xcrun stapler staple "$APP_PATH"
            echo "NOTARIZED_APP=$APP_PATH" >> "$GITHUB_ENV"
          fi

      - name: Package macOS DMG & PKG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          VERSION="${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
          DMG_NAME="PreConnect-macos-release-${VERSION}.dmg"

          package_dmg() {
            local app_path="$1"
            local dmg_out="$2"
            local tmp_dmg_dir
            tmp_dmg_dir="$(mktemp -d "$RUNNER_TEMP/dmg_XXXXXX")"
            cp -R "$app_path" "$tmp_dmg_dir/"
            ln -s /Applications "$tmp_dmg_dir/Applications"
            hdiutil create -volname "PreConnect" -srcfolder "$tmp_dmg_dir" -ov -format UDZO "$dmg_out"
            rm -rf "$tmp_dmg_dir"
          }

          if [ "${DEVID_BUILD:-}" = "true" ]; then
            APP_PATH="${NOTARIZED_APP:-}"
            if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
              APP_PATH=$(find "$RUNNER_TEMP/macos_export" -maxdepth 3 -type d -name "*.app" 2>/dev/null | head -n1 || true)
            fi
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              package_dmg "$APP_PATH" "$GITHUB_WORKSPACE/artifacts/$DMG_NAME"
            fi
          else
            APP_PATH=$(find "$RUNNER_TEMP/macos_export" -maxdepth 3 -type d -name "*.app" 2>/dev/null | head -n1 || true)
            if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
              APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 3 -type d -name "*.app" 2>/dev/null | head -n1 || true)
            fi
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              package_dmg "$APP_PATH" "$GITHUB_WORKSPACE/artifacts/$DMG_NAME"
            fi
          fi

          if [ "${STORE_BUILD:-}" = "true" ]; then
            STORE_PKG=$(find "$RUNNER_TEMP/macos_store_export" -maxdepth 2 -name "*.pkg" 2>/dev/null | head -n1 || true)
            if [ -n "$STORE_PKG" ] && [ -f "$STORE_PKG" ]; then
              cp "$STORE_PKG" "$GITHUB_WORKSPACE/artifacts/PreConnect-macos-release-${VERSION}.pkg"
            else
              echo "STORE_BUILD was true but no .pkg file found in macos_store_export!" >&2
              exit 1
            fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-artifacts
          path: artifacts/*
          if-no-files-found: ignore

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -d artifacts ] && find artifacts -type f -print -quit | grep -q .; then
            gh release upload "${{ needs.prepare-version.outputs.release_tag }}" artifacts/* --clobber
          fi

  publish-google-play:
    name: Publish Google Play
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-pending.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    needs: [detect-pending, prepare-version, build-android-aab]
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 0

      - name: Download Android AAB Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: android-aab-artifacts
          path: artifacts/android

      - name: Resolve AAB
        id: aab
        shell: bash
        run: |
          AAB_FILE=$(find artifacts/android -type f -name "*.aab" | head -n1 || true)
          if [ -z "$AAB_FILE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .aab file found in downloaded artifacts."
            exit 0
          fi
          ABS_AAB_FILE="$(pwd)/$AAB_FILE"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "file=$ABS_AAB_FILE" >> "$GITHUB_OUTPUT"
          echo "Using AAB: $ABS_AAB_FILE"

      - name: Check Google Play Credentials
        id: play_auth
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Prerequisites
        shell: bash
        run: |
          if [ "${{ steps.aab.outputs.found }}" != "true" ]; then
            echo "Android .aab artifact is missing. Ensure Android AAB build succeeded."
            exit 1
          fi

      - name: Generate Google Play Release Notes
        id: play_notes
        shell: bash
        run: |
          NOTES_DIR="android/fastlane/metadata/android"
          CHANGELOG_DIR="$NOTES_DIR/en-US/changelogs"
          rm -rf "$NOTES_DIR"
          mkdir -p "$CHANGELOG_DIR"

          if [ -f CHANGELOG.md ]; then
            NOTES="$(
              awk '
                /^## \[/ && !/\[Unreleased\]/ {
                  if (found) exit
                  found = 1
                  next
                }
                found && /^## \[/ { exit }
                found { print }
              ' CHANGELOG.md \
              | sed 's/^[-*] /• /' \
              | sed 's/^#+[[:space:]]*//'
            )"
          fi

          if [ -z "$(printf '%s' "${NOTES:-}" | tr -d '[:space:]')" ]; then
            NOTES="$(git log -1 --pretty=%B)"
          fi

          if [ -z "$(printf '%s' "${NOTES:-}" | tr -d '[:space:]')" ]; then
            NOTES="PreConnect ${{ needs.prepare-version.outputs.version_name }}+${{ needs.prepare-version.outputs.version_code }}"
          fi

          NOTES=$(printf '%s\n' "$NOTES" | awk -v max=480 '
            BEGIN { len = 0 }
            {
              add = length($0) + (len > 0 ? 1 : 0)
              if (len + add <= max) {
                if (len > 0) printf "\n"
                printf "%s", $0
                len += add
              } else {
                exit
              }
            }
            END {
              if (len > 0) printf "\n"
            }
          ')

          printf '%s' "$NOTES" > "$CHANGELOG_DIR/default.txt"
          printf '%s' "$NOTES" > "$CHANGELOG_DIR/${{ needs.prepare-version.outputs.version_code }}.txt"

          echo "dir=$NOTES_DIR" >> "$GITHUB_OUTPUT"

      - name: Set Up Ruby
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Upload to Google Play
        if: steps.aab.outputs.found == 'true' && steps.play_auth.outputs.enabled == 'true'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_OPT_OUT_USAGE: "1"
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          AAB_PATH: ${{ steps.aab.outputs.file }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          cd android && bundle exec fastlane play_store_upload
