name: Deploy Web App

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-web:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Release Env
        run: |
          cat > .env <<'EOF'
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }}
          EOF

      - name: Build Flutter Web
        run: flutter build web --release --tree-shake-icons --csp --no-wasm-dry-run --no-web-resources-cdn --dart-define-from-file=.env

      - name: Deploy to VPS
        if: secrets.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "build/web/*"
          target: "/var/www/preconnect-web"
          strip_components: 2
