name: Store Promotion

on:
  schedule:
    - cron: "00 18 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FASTLANE_VERBOSE: "true"
  FASTLANE_OPT_OUT_USAGE: "1"

concurrency:
  group: store-promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    name: Promote ${{ matrix.target }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Google Play
            run_play: true
            run_chrome: false
            run_firefox: false
            run_apple: false
            os: ubuntu-latest
          - target: Chrome Extension
            run_play: false
            run_chrome: true
            run_firefox: false
            run_apple: false
            os: ubuntu-latest
          - target: Firefox Add-on
            run_play: false
            run_chrome: false
            run_firefox: true
            run_apple: false
            os: ubuntu-latest
          - target: Apple App Store
            run_play: false
            run_chrome: false
            run_firefox: false
            run_apple: true
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Credentials
        if: matrix.run_play
        id: play_auth
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not provided."
          fi

      - name: Setup Ruby
        if: (matrix.run_play && steps.play_auth.outputs.enabled == 'true') || matrix.run_apple
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Promote Play Store Track
        if: matrix.run_play && steps.play_auth.outputs.enabled == 'true'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_OPT_OUT_USAGE: "1"
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          cd android && bundle exec fastlane promote_beta_to_production

      - name: Setup Flutter
        if: matrix.run_chrome
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Cache Pub Packages
        if: matrix.run_chrome
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Flutter Pub Get
        if: matrix.run_chrome
        shell: bash
        run: flutter pub get

      - name: Extension Env
        if: matrix.run_chrome
        shell: bash
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" > .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}" >> .env
          echo "GOOGLE_SCOPES=${{ secrets.GOOGLE_SCOPES }}" >> .env

      - name: Build Extensions
        if: matrix.run_chrome
        shell: bash
        run: ./tool/build_extension.sh

      - name: Chrome Artifact
        if: matrix.run_chrome
        uses: actions/upload-artifact@v7
        with:
          name: store-promotion-chrome-extension
          path: build/chrome-extension.zip
          if-no-files-found: error

      - name: Authenticate to Google Cloud
        if: matrix.run_chrome
        id: auth
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is missing"
            exit 1
          fi
          ACCESS_TOKEN="$(node -e '
            const crypto = require("crypto");
            const https = require("https");
            const sa = JSON.parse(process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON);
            const now = Math.floor(Date.now() / 1000);
            const b64u = (buf) => buf.toString("base64").replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
            const header = b64u(Buffer.from(JSON.stringify({ alg: "RS256", typ: "JWT" })));
            const payload = b64u(Buffer.from(JSON.stringify({
              iss: sa.client_email,
              scope: "https://www.googleapis.com/auth/chromewebstore",
              aud: sa.token_uri || "https://oauth2.googleapis.com/token",
              exp: now + 3600,
              iat: now
            })));
            const unsigned = `${header}.${payload}`;
            const signer = crypto.createSign("RSA-SHA256");
            signer.update(unsigned);
            const sig = b64u(signer.sign(sa.private_key));
            const jwt = `${unsigned}.${sig}`;
            const data = new URLSearchParams({
              grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion: jwt
            }).toString();
            const req = https.request(sa.token_uri || "https://oauth2.googleapis.com/token", {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "Content-Length": Buffer.byteLength(data)
              }
            }, (res) => {
              let body = "";
              res.on("data", chunk => body += chunk);
              res.on("end", () => {
                if (res.statusCode >= 200 && res.statusCode < 300) {
                  process.stdout.write(JSON.parse(body).access_token);
                } else {
                  console.error(body);
                  process.exit(1);
                }
              });
            });
            req.on("error", (err) => { console.error(err); process.exit(1); });
            req.write(data);
            req.end();
          ')"
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to generate access token"
            exit 1
          fi
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$ACCESS_TOKEN"

      - name: Publish Chrome Extension
        if: matrix.run_chrome
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
        shell: bash
        run: |
          ITEM_NAME="publishers/${CHROME_WEBSTORE_PUBLISHER_ID}/items/${CHROME_WEBSTORE_EXTENSION_ID}"
          STATUS_JSON="$(
            curl -fsSL \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Accept: application/json" \
              "https://chromewebstore.googleapis.com/v2/${ITEM_NAME}:fetchStatus" \
            || true
          )"

          SUBMITTED_STATE="$(
            printf '%s' "$STATUS_JSON" | jq -r '
              .submittedItemRevisionStatus.state? // empty
            '
          )"

          if [ "$SUBMITTED_STATE" = "PENDING_REVIEW" ]; then
            echo "Pending review found; canceling before upload."
            curl -fsSL \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -X POST \
              "https://chromewebstore.googleapis.com/v2/${ITEM_NAME}:cancelSubmission" || true
          else
            echo "No pending review found; continuing with upload."
          fi

          curl \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -X POST \
            -T build/chrome-extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/${ITEM_NAME}:upload"

          curl \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/${ITEM_NAME}:publish"

      - name: Download Apple Deliverables from Release
        if: matrix.run_apple
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p deliverables
          RUN_ID=$(gh run list --workflow release.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --dir deliverables || true
          else
            gh release download --dir deliverables --pattern "PreConnect-ios-release-*.ipa" --clobber || true
            gh release download --dir deliverables --pattern "PreConnect-macos-release-*.pkg" --clobber || true
          fi
          ls -la deliverables/

      - name: Resolve Apple Deliverables
        if: matrix.run_apple
        id: resolve_apple
        shell: bash
        run: |
          IPA=$(find deliverables -type f -name "*.ipa" | head -n1 || true)
          PKG=$(find deliverables -type f -name "*.pkg" | head -n1 || true)
          if [ -f "$IPA" ]; then
            echo "ios_ready=true" >> "$GITHUB_OUTPUT"
            echo "ios_path=$IPA" >> "$GITHUB_OUTPUT"
            FILENAME=$(basename "$IPA")
            VERSION_STR=${FILENAME#PreConnect-ios-release-}
            VERSION_STR=${VERSION_STR%.ipa}
            VERSION_NAME=${VERSION_STR%+*}
            VERSION_CODE=${VERSION_STR#*+}
            echo "ios_version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
            echo "ios_version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          else
            echo "ios_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$PKG" ]; then
            echo "macos_ready=true" >> "$GITHUB_OUTPUT"
            echo "macos_path=$PKG" >> "$GITHUB_OUTPUT"
            FILENAME=$(basename "$PKG")
            VERSION_STR=${FILENAME#PreConnect-macos-release-}
            VERSION_STR=${VERSION_STR%.pkg}
            VERSION_NAME=${VERSION_STR%+*}
            VERSION_CODE=${VERSION_STR#*+}
            echo "macos_version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
            echo "macos_version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          else
            echo "macos_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload and Release iOS to App Store
        if: matrix.run_apple && steps.resolve_apple.outputs.ios_ready == 'true' && env.APP_STORE_CONNECT_API_KEY != ''
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          IOS_VERSION_NAME: ${{ steps.resolve_apple.outputs.ios_version_name }}
          IOS_VERSION_CODE: ${{ steps.resolve_apple.outputs.ios_version_code }}
        shell: bash
        run: |
          cd ios && bundle exec fastlane release_to_app_store \
            ipa:"$GITHUB_WORKSPACE/${{ steps.resolve_apple.outputs.ios_path }}"

      - name: Upload macOS to App Store Connect
        if: matrix.run_apple && steps.resolve_apple.outputs.macos_ready == 'true' && env.APP_STORE_CONNECT_API_KEY != ''
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          MACOS_VERSION_NAME: ${{ steps.resolve_apple.outputs.macos_version_name }}
          MACOS_VERSION_CODE: ${{ steps.resolve_apple.outputs.macos_version_code }}
        shell: bash
        run: |
          cd macos && bundle exec fastlane upload_mac_to_app_store \
            pkg:"$GITHUB_WORKSPACE/${{ steps.resolve_apple.outputs.macos_path }}"

      - name: Download Firefox Extension from Release
        if: matrix.run_firefox
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p deliverables
          RUN_ID=$(gh run list --workflow release.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --dir deliverables || true
          fi
          if ! find deliverables -type f -name "PreConnect-firefox-extension-release-*.zip" | grep -q .; then
            gh release download --dir deliverables --pattern "PreConnect-firefox-extension-release-*.zip" --clobber || true
          fi
          ls -la deliverables/

      - name: Resolve Firefox Extension
        if: matrix.run_firefox
        id: resolve_firefox
        shell: bash
        run: |
          XPI=$(find deliverables -type f -name "PreConnect-firefox-extension-release-*.zip" | head -n1 || true)
          if [ -f "$XPI" ]; then
            echo "firefox_ready=true" >> "$GITHUB_OUTPUT"
            echo "firefox_path=$XPI" >> "$GITHUB_OUTPUT"
          else
            echo "firefox_ready=false" >> "$GITHUB_OUTPUT"
            echo "No Firefox extension found in the latest release."
          fi

      - name: Publish Firefox Extension
        if: matrix.run_firefox && steps.resolve_firefox.outputs.firefox_ready == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          node tool/publish_firefox.js "preconnect@sabbirba.com" \
            "$GITHUB_WORKSPACE/${{ steps.resolve_firefox.outputs.firefox_path }}" \
            "$AMO_JWT_ISSUER" "$AMO_JWT_SECRET"
