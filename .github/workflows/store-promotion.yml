name: Store Promotion

on:
  schedule:
    - cron: "00 18 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: store-promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    name: Promote ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Google Play
            run_play: true
            run_chrome: false
          - target: Chrome Web Store
            run_play: false
            run_chrome: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Package
        if: matrix.run_play
        id: android_meta
        shell: bash
        run: |
          PACKAGE_NAME=$(grep -E 'applicationId\s*=' android/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Check Credentials
        if: matrix.run_play
        id: play_auth
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not provided."
          fi

      - name: Setup Ruby
        if: matrix.run_play && steps.play_auth.outputs.enabled == 'true'
        uses: ruby/setup-ruby@v1.315.0
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        if: matrix.run_play && steps.play_auth.outputs.enabled == 'true'
        run: |
          gem install bundler --no-document
          bundle config set frozen false
          bundle install

      - name: Promote Beta
        if: matrix.run_play && steps.play_auth.outputs.enabled == 'true'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_OPT_OUT_USAGE: "1"
        run: |
          bundle exec fastlane supply \
            --package_name "${{ steps.android_meta.outputs.package_name }}" \
            --json_key_data "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" \
            --track "beta" \
            --track_promote_to "production" \
            --track_promote_release_status "completed" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_metadata true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true

      - name: Setup Flutter
        if: matrix.run_chrome
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"

      - name: Flutter Pub Get
        if: matrix.run_chrome
        shell: bash
        run: flutter pub get

      - name: Chrome Env
        if: matrix.run_chrome
        shell: bash
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" > .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}" >> .env
          echo "GOOGLE_SCOPES=${{ secrets.GOOGLE_SCOPES }}" >> .env

      - name: Chrome Extension
        if: matrix.run_chrome
        shell: bash
        run: ./tool/build_extension.sh

      - name: Chrome Artifact
        if: matrix.run_chrome
        uses: actions/upload-artifact@v7
        with:
          name: store-promotion-chrome-extension
          path: build/chrome-extension.zip
          if-no-files-found: error

      - name: Auth GCloud
        if: matrix.run_chrome
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Setup GCloud
        if: matrix.run_chrome
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Auth Service
        if: matrix.run_chrome
        id: auth
        shell: bash
        env:
          CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          key_file="$RUNNER_TEMP/chrome-web-store-service-account.json"
          printf '%s' "$CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON" > "$key_file"
          chmod 600 "$key_file"
          gcloud auth activate-service-account --key-file="$key_file"

          access_token="$(
            gcloud auth print-access-token \
              --scopes=https://www.googleapis.com/auth/chromewebstore
          )"
          echo "::add-mask::$access_token"
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Publish Chrome
        if: matrix.run_chrome
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
        shell: bash
        run: |
          ITEM_NAME="publishers/${CHROME_WEBSTORE_PUBLISHER_ID}/items/${CHROME_WEBSTORE_EXTENSION_ID}"
          STATUS_JSON="$(
            curl -fsSL \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Accept: application/json" \
              "https://chromewebstore.googleapis.com/v2/${ITEM_NAME}:fetchStatus" \
            || true
          )"

          SUBMITTED_STATE="$(
            printf '%s' "$STATUS_JSON" | jq -r '
              .submittedItemRevisionStatus.state? // empty
            '
          )"

          if [ "$SUBMITTED_STATE" = "PENDING_REVIEW" ]; then
            echo "Pending review found; canceling before upload."
            curl -fsSL \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -X POST \
              "https://chromewebstore.googleapis.com/v2/${ITEM_NAME}:cancelSubmission"
          else
            echo "No pending review found; continuing with upload."
          fi

          curl \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -X POST \
            -T build/chrome-extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/${ITEM_NAME}:upload"

          curl \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/${ITEM_NAME}:publish"
