name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Flutter Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Cache Pub
        uses: actions/cache@v5.0.5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter Pub Get
        shell: bash
        run: flutter pub get

      - name: Format Dart
        shell: bash
        run: dart format --set-exit-if-changed .

      - name: Flutter Analyze
        shell: bash
        run: flutter analyze

      - name: Flutter Test
        shell: bash
        run: flutter test
