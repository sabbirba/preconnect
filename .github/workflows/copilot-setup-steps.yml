name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - pubspec.yaml
      - pubspec.lock
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - pubspec.yaml
      - pubspec.lock

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        shell: bash
        run: flutter pub get
