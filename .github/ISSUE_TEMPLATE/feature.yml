name: Feature Request
description: Suggest a new feature, tool, or workflow for PreConnect
title: "[Feature] "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: This proposal does not require publishing private student data or credentials.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication and Onboarding
        - Home and Navigation
        - Classes and Schedules
        - Exams and Alarms
        - Seat Status
        - Profile and Degree Progress
        - Friends and Sharing
        - Campus Tools
        - Course Materials
        - Notifications
        - Offline and Caching
        - Accessibility and Design
        - Android
        - iOS or macOS
        - Web or Browser Extensions
        - Contributor Experience
        - CI or Release Automation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the student or contributor problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how the new feature should work and how users will interact with it.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: List observable behaviors or requirements that define completion.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you considered.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to contribute it?
      options:
        - Yes
        - Yes, with guidance
        - I can test it
        - Not currently
    validations:
      required: true
