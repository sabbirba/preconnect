server {
  listen 80;
  server_name _;
  resolver 1.1.1.1 1.0.0.1 ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires -1;
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires -1;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires -1;
    try_files $uri =404;
  }

  location = /main.dart.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri =404;
  }

  location = /flutter.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri =404;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass https://api.preconnect.app/;
    proxy_http_version 1.1;
    proxy_set_header Host api.preconnect.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /img {
    if ($arg_u = "") { return 400; }
    if ($arg_u !~* "^https?://") { return 400; }
    if ($arg_u !~* "^https?://([^/]*\\.)?(connect\\.bracu\\.ac\\.bd|github\\.com|githubusercontent\\.com|avatars\\.githubusercontent\\.com|files\\.preconnect\\.app)(/|$)") { return 403; }
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header User-Agent "preconnect-web-image-proxy/1.0";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass $arg_u;
    proxy_buffering on;
    add_header Cache-Control "public, max-age=3600, s-maxage=43200, stale-while-revalidate=86400" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location ^~ /canvaskit/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location ^~ /icons/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
